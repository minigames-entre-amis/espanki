<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Espanki">
<title>Espanki – Apprends l'espagnol</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f7;--card:#fff;--ink:#3c3c3c;--mute:#777;--line:#e5e5e5;
  --green:#58cc02;--green-d:#58a700;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#ea2b2b;
  --yellow:#ffc800;--yellow-d:#e5b400;--orange:#ff9600;--purple:#ce82ff;
  --ok-bg:#d7ffb8;--ok-ink:#58a700;--bad-bg:#ffdfe0;--bad-ink:#ea2b2b;
}
@media (prefers-color-scheme:dark){:root{--bg:#131f24;--card:#1f2c33;--ink:#f1f7fb;--mute:#8aa0ab;--line:#37464f;--ok-bg:#1f3a15;--bad-bg:#40191b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#app{max-width:680px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:22px;color:var(--green)}
.chips{display:flex;gap:14px;font-weight:900}
.chip{display:flex;align-items:center;gap:4px}
.chip.fire{color:var(--orange)}.chip.xp{color:var(--yellow-d)}.chip.lvl{color:var(--purple)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px;z-index:6}
nav button{flex:1;max-width:150px;border:2px solid transparent;background:none;border-radius:14px;padding:8px 4px;font-size:12px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
nav button span{display:block;font-size:22px}
nav button.on{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
h2{margin:22px 0 10px;font-size:20px;font-weight:900}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.btn{display:inline-block;border:0;border-radius:16px;padding:14px 22px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;font-size:15px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.block{display:block;width:100%}
.btn:disabled{background:var(--line);box-shadow:none;color:var(--mute);cursor:not-allowed}
.hero{display:flex;gap:16px;align-items:center}
.parrot{font-size:70px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;flex:1;font-size:16px}
.bubble:before{content:"";position:absolute;left:-10px;top:26px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.goal{display:flex;align-items:center;gap:16px;margin-top:14px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:12px;padding:6px 12px;font-size:14px;font-weight:900}
.pill.b{background:rgba(28,176,246,.15);color:var(--blue)}.pill.g{background:rgba(88,204,2,.15);color:var(--green-d)}.pill.o{background:rgba(255,150,0,.16);color:var(--orange)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;width:150px}
.node .disc{position:relative;width:84px;height:84px;display:grid;place-items:center}
.node .disc i{position:absolute;inset:9px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:32px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.node small{color:var(--mute);font-size:12px}
.node:active .disc i{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:13px}
.badge .e{font-size:34px;display:block;filter:grayscale(1);opacity:.35}
.badge.on .e{filter:none;opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--mute);font-size:13px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--line)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.bars div em{display:block;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.mute{color:var(--mute);font-size:14px}
/* lesson overlay */
#lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;margin:0 auto;padding:16px}
.x{background:none;border:0;font-size:26px;color:var(--mute)}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s;position:relative}
.pbar i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.combo{font-weight:900;color:var(--orange);min-width:60px;text-align:right}
.lbody{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:10px 20px 20px;display:flex;flex-direction:column}
.tag{align-self:flex-start;background:var(--purple);color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.q{font-size:15px;color:var(--mute);margin:14px 0 8px}
.prompt{display:flex;align-items:center;gap:12px;font-size:clamp(22px,5.5vw,32px);font-weight:900;margin:6px 0 22px;line-height:1.15}
.spk{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-size:22px}
.ans{font-size:clamp(20px,5vw,26px);color:var(--green-d);font-weight:900;border-top:2px dashed var(--line);padding-top:18px;margin-top:6px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 3px 0 var(--line);font-size:18px}
.choice kbd{border:2px solid var(--line);border-radius:8px;padding:0 8px;color:var(--mute);font-size:14px}
@media (hover:hover){.choice:hover{background:rgba(28,176,246,.1);border-color:var(--blue)}}
.choice.right{background:var(--ok-bg);border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.choice.wrong{background:var(--bad-bg);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.choice.dis{pointer-events:none}
#typein{font-size:22px;padding:14px}
.lfoot{border-top:2px solid var(--line);padding:16px;transition:background .2s}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.lfoot>div{max-width:640px;margin:0 auto}
.fb{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.fb big{font-size:42px}
.fb b{display:block;font-size:20px}.ok .fb b{color:var(--ok-ink)}.bad .fb b{color:var(--bad-ink)}
.fb span{font-size:15px}.ok .fb span{color:var(--ok-ink)}.bad .fb span{color:var(--bad-ink)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:0;border-radius:14px;padding:10px 4px;color:#fff;font-weight:900;font-size:14px;line-height:1.3}
.rate button small{display:block;opacity:.85;font-weight:700;font-size:12px}
.rate .r0{background:var(--red);box-shadow:0 4px 0 var(--red-d)}.rate .r1{background:var(--orange);box-shadow:0 4px 0 #cc7700}
.rate .r2{background:var(--green);box-shadow:0 4px 0 var(--green-d)}.rate .r3{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.sum{margin:auto;text-align:center}
.sum .parrot{font-size:110px}.sum h1{font-size:34px;margin:8px 0;color:var(--yellow-d)}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.sumgrid div{border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--card)}
.sumgrid b{display:block;font-size:24px}.sumgrid span{font-size:12px;color:var(--mute);text-transform:uppercase}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-140px);z-index:50;background:var(--card);border:2px solid var(--yellow);border-radius:16px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .4s;font-weight:900;text-align:center}
#toast.show{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
/* quêtes, gels, nouveaux exercices */
.chip.ice{color:var(--blue)}
.pill.r{background:rgba(255,75,75,.14);color:var(--red-d)}
.quest{display:flex;align-items:center;gap:12px;padding:8px 0}
.quest+.quest{border-top:1px solid var(--line)}
.quest .qe{font-size:26px;width:34px;text-align:center;flex:none}
.quest.done>div{opacity:.7}
.pbar.sm{height:10px;margin-top:6px;flex:none}
.pbar.sm i:after{display:none}
.btn.gold{background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d);color:#5a4300}
.built,.tiles{display:flex;flex-wrap:wrap;gap:8px}
.built{min-height:62px;border-bottom:2px solid var(--line);padding:4px 0 12px;margin-bottom:20px;align-content:flex-start}
.tile{border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:18px}
@media (hover:hover){.tile:hover:not(:disabled){border-color:var(--blue)}}
.tile:disabled{cursor:default}
.tile.used{color:transparent;background:var(--line);box-shadow:none}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--blue);text-align:center;line-height:1.15}
.blank.ok{color:var(--green-d);border-color:var(--green)}.blank.bad{color:var(--red-d);border-color:var(--red)}
.hint{color:var(--mute);font-size:16px;margin:-10px 0 18px}
.choices.words{grid-template-columns:1fr 1fr}
/* imagier */
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;width:100%;margin:0 auto}
.picopt{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--line);aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
@media (hover:hover){.picopt:hover{border-color:var(--blue)}}
.picopt img,.picopt .swatch{width:100%;height:100%;object-fit:contain;border-radius:12px}
.picopt kbd{position:absolute;top:6px;left:6px;border:2px solid var(--line);border-radius:8px;padding:0 7px;color:var(--mute);font-size:13px;background:var(--card)}
.picopt small{position:absolute;bottom:6px;left:6px;right:6px;background:var(--card);border-radius:8px;font-size:13px;color:var(--red-d)}
.picopt.right{border-color:var(--green);background:var(--ok-bg);box-shadow:0 4px 0 var(--green)}
.picopt.wrong{border-color:var(--red);background:var(--bad-bg);box-shadow:0 4px 0 var(--red)}
.picopt.dis{pointer-events:none}
.picbig{width:min(240px,62vw);aspect-ratio:1;margin:4px auto 20px;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.picbig img,.picbig .swatch{width:100%;height:100%;object-fit:contain}
.swatch{display:block;border-radius:12px;border:2px solid var(--line)}
.noimg{font-size:48px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.unit{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.unit>span{font-size:26px}
u.miss{text-decoration:none;background:rgba(255,75,75,.22);border-radius:4px;padding:0 2px}
.spk.big{width:88px;height:88px;font-size:40px;border-radius:22px;box-shadow:0 5px 0 var(--line)}
.chips{gap:10px}
/* niveau moyen : dictionnaire, oral, histoires, grammaire */
.w{cursor:pointer;border-radius:5px;transition:background .15s}
@media (hover:hover){.w:hover{background:rgba(28,176,246,.14)}}
.w.on{background:rgba(28,176,246,.25);text-decoration:underline dotted var(--blue)}
.gloss{position:fixed;z-index:40;max-width:min(280px,90vw);background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px}
.gloss .gw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gloss .gfr{color:var(--blue-d);font-size:17px}
.spk.sm{width:32px;height:32px;font-size:15px;border-radius:10px;box-shadow:0 2px 0 var(--line)}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--blue);box-shadow:0 6px 0 var(--blue-d);font-size:42px}
.micbtn.on{background:var(--red);box-shadow:0 6px 0 var(--red-d);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.heard{font-size:18px;text-align:center;min-height:24px}
.sok{color:var(--green-d)}.smiss{color:var(--red-d);text-decoration:underline wavy}
.waves{display:grid;gap:10px;margin-bottom:14px}
.waves>div{border:2px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--card)}
.waves small{color:var(--mute)}
.waves canvas{display:block;width:100%;height:56px}
.shrow{justify-content:center}.shrow>*{flex:0 1 auto}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.story .sl{display:flex;gap:10px;align-items:flex-start;margin:8px 0;animation:pop .25s}
.story .av{font-size:34px;line-height:1;flex:none}
.story .bub{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;max-width:100%}
.story .bub small{color:var(--mute);font-size:12px}
.story .es{font-size:19px}
.story .nar .bub{background:none;border:0;padding:4px 0;font-style:italic}
.story .tr{color:var(--mute);font-size:15px;margin-top:2px}
.sbtn{display:flex;gap:6px;margin-top:4px}
.sbtn button{border:0;background:none;color:var(--blue);font-size:13px;padding:2px 4px;font-weight:800}
.sq{margin:14px 0;padding:12px;border:2px dashed var(--blue);border-radius:16px}
.sq .choices{margin-top:10px}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 8px;box-shadow:0 4px 0 var(--line)}
.scard .si{font-size:40px}.scard small{color:var(--mute);font-size:13px}
.scard em{font-style:normal;font-size:12px;color:var(--mute)}.scard em.new{color:var(--blue)}.scard em.done{color:var(--green-d)}
.scard.lock{opacity:.55}
.gramlist{display:grid;gap:8px}
.gcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.gcard>span{font-size:28px}.gcard small{display:block;font-weight:700}
.gram h3{margin:16px 0 6px}.gram p{margin:8px 0;line-height:1.45}
.gram .gl{padding-left:18px;position:relative;margin:4px 0;line-height:1.4}.gram .gl:before{content:"•";position:absolute;left:4px;color:var(--blue)}
.gtw{overflow-x:auto;margin:10px 0}
.gt{border-collapse:collapse;width:100%;font-size:15px}.gt th,.gt td{border:2px solid var(--line);padding:6px 8px;text-align:left}.gt th{background:rgba(28,176,246,.12)}
.gex{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px 10px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.gex .es{font-size:17px}
.tip{margin:12px 0;padding:10px 12px;border-radius:14px;background:rgba(255,200,0,.18)}
.glink{margin-top:8px;border:0;background:rgba(255,255,255,.55);color:var(--blue-d);border-radius:10px;padding:6px 10px;font-weight:900}
.gcard.lock{opacity:.55}.gcard .edit{font-size:18px;padding:4px}
.teaser{display:flex;gap:12px;align-items:center;margin-top:14px;cursor:pointer}
.teaser>span{font-size:36px}.teaser>div{flex:1}.teaser .go{font-size:28px;color:var(--mute)}
@media (max-width:480px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}.story .es{font-size:17px}.micbtn{width:84px;height:84px;font-size:36px}}
/* ---- mobile ---- */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip{white-space:nowrap}
.lbody>*{flex-shrink:0}
nav{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.lfoot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media (max-width:480px){
  #app{padding:0 12px calc(96px + env(safe-area-inset-bottom))}
  header{gap:6px}
  .chips{gap:8px;font-size:15px}
  .hero{gap:10px}.parrot{font-size:48px}.bubble{font-size:15px;padding:10px 12px}
  .ltop{padding:12px 14px}.lbody{padding:6px 14px 14px}.lfoot{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .prompt{flex-wrap:wrap;gap:8px;margin-bottom:16px}.prompt>span{flex:1 1 100%}
  .spk{width:42px;height:42px;font-size:20px}
  .choice{font-size:16px;padding:12px}
  .rate{gap:6px}.rate button{font-size:13px;padding:10px 2px}
  .sumgrid{gap:6px}.sumgrid b{font-size:20px}
  .units{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.unit b{display:block;line-height:1.15}.unit{padding:8px;gap:6px}.unit>span{font-size:20px}.unit b{font-size:14px}
  nav button{font-size:11px;padding:6px 2px}
}
@media (max-width:400px){.logo span{display:none}.chips{gap:7px;font-size:14px}}
@media (max-width:360px){.units{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🦜<span> Espanki</span></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view"></main>
</div>
<nav id="tabs"></nav>
<div id="lesson" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="gloss" class="gloss hidden"></div>
<div id="toast"></div>

{id:38,name:'Voyage avancé',icon:'🗺️',color:'#1cb0f6',words:`Visitamos varios pueblos medievales.=Nous avons visité plusieurs villages médiévaux.

{id:39,name:'Souvenirs',icon:'🕰️',color:'#ffc800',words:`Recuerdo mi primer día de escuela.=Je me souviens de mon premier jour d'école.

?|Où était le chargeur ?|Dans le frigo|Dans la voiture|Sous le lit`},
{id:8,step:8,title:'El examen',fr:'Le grand examen',icon:'📚',chars:{N:'📖',Lucía:'👧',Dani:'👦'},lines:`N|Es lunes. Lucía y Dani esperan delante de la clase.|C'est lundi. Lucía et Dani attendent devant la salle de classe.
Lucía|Estoy muy nerviosa por el examen.|Je suis très nerveuse à cause de l'examen.
Dani|No te preocupes, todo saldrá bien.|Ne t'inquiète pas, tout ira bien.
Lucía|Anoche dormí muy mal. Estudié hasta las dos.|Cette nuit, j'ai très mal dormi. J'ai étudié jusqu'à deux heures.
?|Pourquoi Lucía a-t-elle mal dormi ?|Elle a étudié tard|Elle était malade|Son voisin faisait du bruit
Dani|Yo no. Leí tres capítulos y me fui a dormir temprano.|Pas moi. J'ai lu trois chapitres et je suis allé me coucher tôt.
Lucía|¿Tres capítulos? ¿De qué?|Trois chapitres ? De quoi ?
Dani|De historia, claro. El examen es de historia.|D'histoire, bien sûr. L'examen est un examen d'histoire.
Lucía|No, Dani. Hoy tenemos el examen de matemáticas.|Non, Dani. Aujourd'hui, nous avons l'examen de mathématiques.
?|Quel examen ont-ils aujourd'hui ?|Mathématiques|Histoire|Anglais
Dani|¿Matemáticas? ¡Ay, no! Ahora estoy nervioso yo.|Mathématiques ? Oh non ! Maintenant, c'est moi qui suis nerveux.
Lucía|No te preocupes, Dani. Todo saldrá bien.|Ne t'inquiète pas, Dani. Tout ira bien.
Dani|Muy graciosa.|Très drôle.
?|Comment se sent Dani à la fin ?|Nerveux|Content|Fatigué`},
{id:9,step:9,title:'La cuenta',fr:'Qui paie le dîner ?',icon:'🍷',chars:{N:'📖',Carlos:'👨',Bea:'👩'},lines:`N|Carlos invita a Bea a cenar en un restaurante elegante.|Carlos invite Bea à dîner dans un restaurant chic.
Carlos|Elige tú, hoy pago yo.|Choisis, aujourd'hui c'est moi qui paie.
Bea|¡Qué amable! Para empezar, quiero una sopa de verduras.|Comme c'est gentil ! Pour commencer, je veux une soupe de légumes.
Carlos|Yo, el pescado a la plancha y una copa de vino.|Moi, le poisson grillé et un verre de vin.
?|Qui invite au restaurant ?|Carlos|Bea|Le serveur
N|Después del postre, llega la cuenta: ochenta euros.|Après le dessert, l'addition arrive : quatre-vingts euros.
Carlos|Mmm... Bea, ¿aceptan tarjetas aquí?|Mmm... Bea, ils acceptent les cartes ici ?
Bea|Sí, claro. ¿Por qué?|Oui, bien sûr. Pourquoi ?
Carlos|Porque no tengo efectivo... y olvidé mi tarjeta en casa.|Parce que je n'ai pas d'espèces... et j'ai oublié ma carte à la maison.
?|Quel est le problème de Carlos ?|Il a oublié sa carte|Le poisson est froid|Le restaurant est fermé
Bea|¡Carlos! Y ya me debes veinte euros.|Carlos ! Et tu me dois déjà vingt euros.
Carlos|Lo sé, lo sé. Te lo pago todo el lunes.|Je sais, je sais. Je te rembourse tout lundi.
Bea|Vale. Pago yo... pero la próxima cena la cocinas tú.|D'accord. Je paie... mais le prochain dîner, c'est toi qui le cuisines.
?|Que doit faire Carlos la prochaine fois ?|Cuisiner le dîner|Payer quatre-vingts euros|Inviter la famille de Bea`},
{id:10,step:10,title:'El atasco',fr:'L embouteillage',icon:'🚕',chars:{N:'📖',Clara:'👩',Paco:'🧔'},lines:`N|Clara toma un taxi. Su vuelo sale a las cinco.|Clara prend un taxi. Son vol part à cinq heures.
Clara|Buenas tardes. Necesito ir al aeropuerto, rápido.|Bonjour. J'ai besoin d'aller à l'aéroport, vite.
Paco|Muy bien. Pero hay un atasco enorme en la autopista.|Très bien. Mais il y a un énorme embouteillage sur l'autoroute.
Clara|¿Cuánto tarda el viaje?|Combien de temps dure le trajet ?
Paco|Normalmente, veinte minutos. Hoy, depende del tráfico.|Normalement, vingt minutes. Aujourd'hui, ça dépend de la circulation.
?|Où va Clara ?|À l'aéroport|À la gare|Au musée
N|Una hora después, el taxi casi no se mueve.|Une heure plus tard, le taxi n'avance presque pas.
Paco|En mi opinión, es mejor ir en metro.|À mon avis, il vaut mieux prendre le métro.
Clara|¿Y me lo dice ahora? ¡Vamos a perder el vuelo!|Et vous me le dites maintenant ? On va rater le vol !
?|Que conseille Paco après une heure ?|Prendre le métro|Continuer à pied|Attendre demain
N|Por fin, llegan al aeropuerto a las cinco y diez.|Enfin, ils arrivent à l'aéroport à cinq heures dix.
Clara|¡Mire la pantalla! El vuelo sale con una hora de retraso.|Regardez l'écran ! Le vol part avec une heure de retard.
Paco|¿Ve? Al final, todo funciona. Son ochenta euros.|Vous voyez ? Finalement, tout marche. Ça fait quatre-vingts euros.
Clara|¿Ochenta euros? ¡Eso no tiene sentido!|Quatre-vingts euros ? Ça n'a pas de sens !
?|Pourquoi Clara ne rate-t-elle pas son avion ?|Le vol a une heure de retard|Le taxi roule très vite|Elle prend le métro`},
{id:11,step:11,title:'La fiesta equivocada',fr:'La mauvaise fête',icon:'🎂',chars:{N:'📖',Hugo:'👨',Marina:'👩'},lines:`N|Es sábado por la noche. Hugo llega a una fiesta de cumpleaños.|C'est samedi soir. Hugo arrive à une fête d'anniversaire.
Hugo|¡Hola! Traigo un regalo para Marta.|Salut ! J'apporte un cadeau pour Marta.
Marina|Encantada. Pasa, pasa. ¿Quieres algo de beber?|Enchantée. Entre, entre. Tu veux quelque chose à boire ?
Hugo|Sí, gracias. Hacía tiempo que no venía a una fiesta así.|Oui, merci. Ça faisait longtemps que je n'étais pas venu à une fête comme ça.
Marina|¿Y a qué te dedicas?|Et que fais-tu dans la vie ?
Hugo|Soy profesor. ¿Y tú?|Je suis professeur. Et toi ?
?|Quel est le métier de Hugo ?|Professeur|Médecin|Ingénieur
Marina|Soy médica. Y esta es mi fiesta: hoy cumplo treinta años.|Je suis médecin. Et c'est ma fête : aujourd'hui j'ai trente ans.
Hugo|¿Tu fiesta? Pero... ¿no es la fiesta de Marta?|Ta fête ? Mais... ce n'est pas la fête de Marta ?
Marina|¿Marta? Marta es mi vecina. Vive en el tercer piso.|Marta ? Marta est ma voisine. Elle habite au troisième étage.
?|Qui est Marta ?|La voisine de Marina|La sœur de Hugo|La cousine de Marina
Hugo|¡Perdona la molestia! Esto es el segundo, ¿verdad?|Excuse le dérangement ! Ici, c'est le deuxième, c'est ça ?
Marina|Sí. Pero no te preocupes... ¡quédate un rato! Hay tarta.|Oui. Mais ne t'inquiète pas... reste un moment ! Il y a du gâteau.
Hugo|Bueno, me encantaría. ¡Y felicidades a ti también!|Bon, avec plaisir. Et joyeux anniversaire à toi aussi !
?|Que fait Hugo à la fin ?|Il reste à la fête de Marina|Il rentre chez lui|Il appelle Marta`},
{id:12,step:12,title:'El ladrón de huevos',fr:'Le mystère des œufs',icon:'🥚',chars:{N:'📖',Rosa:'👵',Nico:'👦'},lines:`N|Nico pasa el verano en el pueblo, en casa de su abuela Rosa.|Nico passe l'été au village, chez sa grand-mère Rosa.
Rosa|Nico, otra vez faltan huevos. Ayer tenía doce, hoy seis.|Nico, il manque encore des œufs. Hier j'en avais douze, aujourd'hui six.
?|Combien d'œufs a Rosa aujourd'hui ?|Six|Douze|Deux
Nico|¿Un ladrón? La policía busca a un ladrón en el pueblo.|Un voleur ? La police recherche un voleur dans le village.
Rosa|¿Un ladrón de huevos? ¡Qué tontería!|Un voleur d'œufs ? Quelle bêtise !
Nico|Entonces, un zorro. Ayer vimos un zorro cruzar el camino.|Alors, un renard. Hier, on a vu un renard traverser le chemin.
?|Quel animal ont-ils vu hier ?|Un renard|Une abeille|Un cheval
Rosa|Puede ser. Esta noche vamos a esperar en el jardín.|C'est possible. Ce soir, on va attendre dans le jardin.
N|A medianoche, todo está oscuro. Se oyen los grillos.|À minuit, tout est sombre. On entend les grillons.
Nico|¡Abuela, mira! Algo entra donde están las gallinas.|Grand-mère, regarde ! Quelque chose entre chez les poules.
Rosa|Pero... ¡si es Toby, mi perro!|Mais... c'est Toby, mon chien !
Nico|Y tiene un huevo en la boca. ¡Vaya ladrón!|Et il a un œuf dans la gueule. Quel voleur !
Rosa|Ahora entiendo por qué no come su comida.|Maintenant, je comprends pourquoi il ne mange pas sa pâtée.
?|Qui est le voleur d'œufs ?|Toby, le chien de Rosa|Un renard|Le voisin`},
{id:13,step:13,title:'Las llaves',fr:'Les clés',icon:'🔑',chars:{N:'📖',Alba:'👩',Rubén:'👨'},lines:`N|Un día, Alba y su hermano Rubén volvieron de vacaciones.|Un jour, Alba et son frère Rubén sont rentrés de vacances.
Rubén|Acabo de buscar en la maleta. ¡No tengo las llaves!|Je viens de chercher dans la valise. Je n'ai pas les clés !
Alba|¿Cómo? Debes tenerlas. Las tenías en el aeropuerto.|Comment ? Tu dois les avoir. Tu les avais à l'aéroport.
?|Que cherche Rubén ?|Les clés|Son passeport|Son téléphone
N|Primero trataron de entrar por la ventana, pero estaba cerrada.|D'abord, ils ont essayé d'entrer par la fenêtre, mais elle était fermée.
Rubén|Podemos llamar a un cerrajero. Pero es domingo... y es muy caro.|On peut appeler un serrurier. Mais c'est dimanche... et c'est très cher.
Alba|No quiero perder más tiempo. Voy a llamar a la vecina.|Je ne veux pas perdre plus de temps. Je vais appeler la voisine.
?|Pourquoi ne peuvent-ils pas entrer par la fenêtre ?|Elle est fermée|Elle est trop haute|La voisine dort
N|Pero entonces Alba miró la puerta y vio algo.|Mais alors Alba a regardé la porte et a vu quelque chose.
Alba|Rubén... ¿qué es eso?|Rubén... qu'est-ce que c'est, ça ?
Rubén|¿Eso? Ah... mis llaves. Las dejé ahí antes de las vacaciones.|Ça ? Ah... mes clés. Je les ai laissées là avant les vacances.
Alba|¿Dos semanas con las llaves en la puerta? ¡Increíble!|Deux semaines avec les clés sur la porte ? Incroyable !
Rubén|Bueno... nadie es perfecto.|Bon... personne n'est parfait.
?|Où étaient les clés ?|Sur la porte de la maison|Dans la valise|Chez la voisine`},
{id:14,step:14,title:'La entrevista',fr:'Un entretien surprise',icon:'💼',chars:{N:'📖',Pilar:'👩',Iván:'👨'},lines:`N|Iván tiene una entrevista de trabajo en una empresa grande.|Iván a un entretien d'embauche dans une grande entreprise.
Pilar|Buenos días. Siéntese, por favor. Hábleme de usted.|Bonjour. Asseyez-vous, je vous prie. Parlez-moi de vous.
Iván|Bueno... soy un poco tímido, pero muy trabajador.|Eh bien... je suis un peu timide, mais très travailleur.
Pilar|¿Por qué quiere trabajar con nosotros?|Pourquoi voulez-vous travailler avec nous ?
Iván|Me encanta resolver problemas. Lo importante es no rendirse.|J'adore résoudre des problèmes. L'important est de ne pas abandonner.
?|Comment Iván se décrit-il ?|Timide mais travailleur|Drôle et paresseux|Riche et heureux
Pilar|Muy bien. Voy a buscar su currículum en el ordenador.|Très bien. Je vais chercher votre CV sur l'ordinateur.
N|De repente, el ordenador dejó de funcionar.|Soudain, l'ordinateur a cessé de fonctionner.
Pilar|¡Ay, no! Otra vez. Hay que llamar al técnico.|Oh non ! Encore. Il faut appeler le technicien.
?|Quel problème y a-t-il pendant l'entretien ?|L'ordinateur ne marche plus|Iván arrive en retard|Le téléphone sonne
Iván|¿Me permite? Quizá sea un problema del cable.|Vous permettez ? C'est peut-être un problème de câble.
N|Iván movió un cable y reinició el aparato. ¡Funcionó!|Iván a bougé un câble et redémarré l'appareil. Ça a marché !
Pilar|¡Increíble! ¿Puede empezar el lunes? Necesitamos un técnico.|Incroyable ! Vous pouvez commencer lundi ? Nous avons besoin d'un technicien.
Iván|Pero... yo vengo para el puesto de contable.|Mais... je viens pour le poste de comptable.
?|Quel poste Pilar propose-t-elle à Iván ?|Technicien|Comptable|Directeur`},
{id:15,step:15,title:'Un ruido en la noche',fr:'Un bruit dans la nuit',icon:'🐐',chars:{N:'📖',Teresa:'👩',Mario:'👨'},lines:`N|Teresa y Mario alquilaron una casa rural en la montaña.|Teresa et Mario ont loué un gîte à la montagne.
Teresa|Qué paisaje tan precioso. Valió la pena conducir tres horas.|Quel paysage magnifique. Ça valait la peine de conduire trois heures.
Mario|Sí, aunque la casa es un poco vieja... y oscura.|Oui, même si la maison est un peu vieille... et sombre.
?|Où sont Teresa et Mario ?|Dans un gîte à la montagne|Dans un hôtel en ville|Chez leurs parents
N|A medianoche, se oyó un ruido extraño en el sótano.|À minuit, on a entendu un bruit étrange dans la cave.
Mario|¿Oíste eso? Sospecho que no estamos solos.|Tu as entendu ça ? Je soupçonne que nous ne sommes pas seuls.
Teresa|Imagínate que es un fantasma. ¡Qué miedo!|Imagine que c'est un fantôme. Quelle peur !
Mario|Yo no creo en fantasmas. Pero tú bajas primero.|Moi, je ne crois pas aux fantômes. Mais c'est toi qui descends la première.
?|D'où vient le bruit ?|De la cave|Du toit|Du jardin
N|Bajaron juntos la escalera, muy despacio.|Ils ont descendu l'escalier ensemble, très lentement.
Teresa|¡Mario, mira! Es una cabra comiéndose nuestras patatas.|Mario, regarde ! C'est une chèvre qui mange nos pommes de terre.
Mario|Pues según la guía, aquí hay que probar el queso de cabra.|Eh bien, selon le guide, ici il faut goûter le fromage de chèvre.
Teresa|Mario... la realidad es más extraña que la ficción.|Mario... la réalité est plus étrange que la fiction.
?|Qu'y a-t-il dans la cave ?|Une chèvre|Un fantôme|Un voleur`},
{id:16,step:16,title:'La foto antigua',fr:'La vieille photo',icon:'📷',chars:{N:'📖',Sofía:'👧',Manuel:'👴'},lines:`N|Sofía ordena el armario de su abuelo y encuentra una foto antigua.|Sofía range l'armoire de son grand-père et trouve une vieille photo.
Sofía|Abuelo, ¿quién es esta chica tan guapa?|Papi, qui est cette fille si jolie ?
Manuel|Ay, Sofía... Me enamoré de ella a los dieciséis años.|Ah, Sofía... Je suis tombé amoureux d'elle à seize ans.
Sofía|¡Qué bonito! Entonces, ¿es la abuela?|Que c'est beau ! Alors, c'est mamie ?
Manuel|Pues... no exactamente. Es su hermana, Julia.|Eh bien... pas exactement. C'est sa sœur, Julia.
?|Qui est la fille sur la photo ?|La sœur de la grand-mère|La grand-mère de Sofía|La mère de Sofía
Sofía|¿Cómo? ¡Cuéntame lo que ocurrió después!|Comment ? Raconte-moi ce qui s'est passé ensuite !
Manuel|Julia era lista y alegre; sin embargo, prefería a otro chico.|Julia était intelligente et joyeuse ; pourtant, elle préférait un autre garçon.
Manuel|Un día fui a verla con flores, pero ya se había ido.|Un jour, je suis allé la voir avec des fleurs, mais elle était déjà partie.
?|Pourquoi Manuel n'a-t-il pas pu donner les fleurs à Julia ?|Elle était déjà partie|Elle était malade|Il les avait perdues
Sofía|¿Y las flores?|Et les fleurs ?
Manuel|Me abrió la puerta su hermana... Nunca olvidaré aquel día.|C'est sa sœur qui m'a ouvert la porte... Je n'oublierai jamais ce jour-là.
Sofía|¡Abuelo! Así conociste a la abuela.|Papi ! C'est comme ça que tu as rencontré mamie.
Manuel|Exacto. Pero no se lo cuentes a tu abuela, ¿vale?|Exactement. Mais ne le raconte pas à ta grand-mère, d'accord ?
?|Que demande Manuel à Sofía ?|De ne rien dire à sa grand-mère|De ranger l'armoire|D'appeler Julia`}
];
const GRAMMAR=[
{id:'articles',title:'Articles, genre et pluriel',icon:'🔤',step:1,units:[2,3,6],body:`p|En espagnol, chaque nom est **masculin** ou **féminin**, comme en français (mais pas toujours le même genre !).
t|Article|Masculin|Féminin
r|défini singulier|**el** parque|**la** casa
r|défini pluriel|**los** niños|**las** flores
r|indéfini|**un** hermano, **unos**|**una** hermana, **unas**
l|Noms en **-o** : souvent masculins ; en **-a** : souvent féminins. Exceptions : **el día**, **la mano**.
l|Pluriel : **+s** après une voyelle (casa → casas), **+es** après une consonne (ciudad → ciudades).
l|Contractions : **a + el → al**, **de + el → del** (voy al trabajo, cerca del centro).
ex|Los niños juegan en el parque.=Les enfants jouent dans le parc.
ex|Tengo dos hermanos y una hermana.=J'ai deux frères et une sœur.
ex|Mi casa está cerca del centro.=Ma maison est près du centre.
ex|Las flores huelen muy bien en el jardín.=Les fleurs sentent très bon dans le jardin.
tip|Pas d'article partitif : « du pain » se dit simplement **pan** (Necesito comprar pan.).`},
{id:'ser-presenter',title:'Pronoms sujets et verbe ser',icon:'🙋',step:1,units:[1,4],body:`p|On omet presque toujours le pronom sujet : la terminaison du verbe suffit. **Soy de Francia.** = Je viens de France.
t|Pronom|Ser
r|yo (je)|soy
r|tú (tu)|eres
r|él, ella, usted (il, elle, vous)|es
r|nosotros, nosotras (nous)|somos
r|vosotros, vosotras (vous)|sois
r|ellos, ellas, ustedes (ils, elles, vous)|son
l|**usted / ustedes** = vouvoiement ; ils se conjuguent comme él / ellos.
l|**Ser** dit qui on est : identité, origine, métier, caractère.
ex|Soy de Francia.=Je viens de France.
ex|Mi marido es profesor.=Mon mari est professeur.
ex|Somos tres en mi familia.=Nous sommes trois dans ma famille.
ex|Mis amigos son muy simpáticos.=Mes amis sont très sympathiques.
tip|Pas d'article devant un métier : **es profesor**, pas « es un profesor ».`},
{id:'tener',title:'Le verbe tener',icon:'🤲',step:1,units:[2,3,5,19],body:`p|**Tener** = avoir (posséder). C'est un verbe irrégulier très fréquent.
t|Sujet|Tener
r|yo|tengo
r|tú|tienes
r|él, ella, usted|tiene
r|nosotros|tenemos
r|vosotros|tenéis
r|ellos, ustedes|tienen
h|Expressions avec tener
l|L'âge : **tener … años** (avoir … ans).
l|**tener hambre, sed, frío, miedo** = avoir faim, soif, froid, peur.
l|**tener que + infinitif** = devoir (obligation).
ex|Tengo veinticinco años.=J'ai vingt-cinq ans.
ex|Tengo hambre y mucha sed.=J'ai faim et très soif.
ex|Tengo que trabajar mañana.=Je dois travailler demain.
ex|Tengo miedo de volar en avión.=J'ai peur de voler en avion.
tip|« Avoir » comme auxiliaire du passé composé, c'est **haber**, jamais tener : **He perdido mi maleta.**`},
{id:'present-regulier',title:'Présent des verbes réguliers',icon:'🔁',step:2,units:[4,5,7],body:`p|On enlève **-ar**, **-er** ou **-ir** et on ajoute la terminaison de la personne.
t|Sujet|hablar|comer|vivir
r|yo|hablo|como|vivo
r|tú|hablas|comes|vives
r|él, ella, usted|habla|come|vive
r|nosotros|hablamos|comemos|vivimos
r|vosotros|habláis|coméis|vivís
r|ellos, ustedes|hablan|comen|viven
l|Les verbes en -er et en -ir ne diffèrent qu'avec **nosotros** et **vosotros**.
ex|Mi madre trabaja en un hospital.=Ma mère travaille dans un hôpital.
ex|Ellos hablan muy rápido.=Ils parlent très vite.
ex|Mis abuelos viven en el campo.=Mes grands-parents vivent à la campagne.
ex|Siempre bebo agua por la mañana.=Je bois toujours de l'eau le matin.
tip|Le présent sert aussi pour un futur proche : **El próximo mes viajo a México.**`},
{id:'questions-negation',title:'Questions et négation',icon:'❓',step:2,units:[1,7,10],body:`p|À l'écrit, la question s'ouvre avec **¿** et se ferme avec **?** (pareil pour ¡ !). À l'oral, seule l'intonation monte.
t|Mot|Sens
r|qué|que, quoi, quel
r|quién|qui
r|cómo|comment
r|dónde|où
r|cuándo|quand
r|cuánto|combien
r|por qué|pourquoi (réponse : **porque**)
h|La négation
l|**no** se place juste devant le verbe : No entiendo.
l|**nunca, nada, nadie** : avec no devant le verbe, ou seuls en tête de phrase.
ex|¿Dónde vives?=Où habites-tu ?
ex|¿Por qué estudias español?=Pourquoi étudies-tu l'espagnol ?
ex|Estudio español porque me encanta viajar.=J'étudie l'espagnol parce que j'adore voyager.
ex|No entiendo, ¿puedes repetir?=Je ne comprends pas, peux-tu répéter ?
ex|Nunca como pescado.=Je ne mange jamais de poisson.
tip|Les mots interrogatifs portent toujours un accent écrit : **qué, cómo, dónde**.`},
{id:'possessifs-demonstratifs',title:'Possessifs et démonstratifs',icon:'👉',step:2,units:[4,8,13],body:`p|Le possessif s'accorde avec la chose possédée, pas avec le possesseur.
t|Possesseur|Singulier|Pluriel
r|moi|mi|mis
r|toi|tu|tus
r|lui, elle, vous (usted)|su|sus
r|nous|nuestro, nuestra|nuestros, nuestras
r|vous (vosotros)|vuestro, vuestra|vuestros, vuestras
r|eux, vous (ustedes)|su|sus
h|Démonstratifs
l|**este, esta, estos, estas** : ce…ci (près de moi).
l|**ese, esa, esos, esas** : ce…là (près de toi). **aquel, aquella** : là-bas, loin.
l|**esto, eso** : ceci, cela (neutre).
ex|Mi hermana vive en Madrid.=Ma sœur vit à Madrid.
ex|Vivo con mis padres.=Je vis avec mes parents.
ex|Esta casa es muy grande.=Cette maison est très grande.
ex|Este reloj es un regalo de mi padre.=Cette montre est un cadeau de mon père.
ex|¿Quién es ese hombre?=Qui est cet homme ?
tip|**tu** (ton) n'a pas d'accent ; **tú** (toi) en a un.`},
{id:'irreguliers',title:'Verbes irréguliers fréquents',icon:'⚡',step:2,units:[5,10,31],body:`p|Ces verbes très courants sont irréguliers au présent : apprends-les par cœur !
t|Verbe|yo|tú|ellos
r|ir (aller)|voy|vas|van
r|hacer (faire)|hago|haces|hacen
r|poder (pouvoir)|puedo|puedes|pueden
r|querer (vouloir)|quiero|quieres|quieren
r|venir (venir)|vengo|vienes|vienen
r|decir (dire)|digo|dices|dicen
r|saber (savoir)|sé|sabes|saben
l|Beaucoup de verbes changent de voyelle : **o → ue** (poder, dormir), **e → ie** (querer, empezar), **e → i** (pedir).
l|Pas de changement avec nosotros et vosotros : **podemos, queremos**.
ex|Voy al trabajo en autobús.=Je vais au travail en bus.
ex|No puedo venir esta noche.=Je ne peux pas venir ce soir.
ex|Quiero un café con leche.=Je veux un café au lait.
ex|Ella dice que viene tarde.=Elle dit qu'elle vient tard.
ex|Sé hablar un poco de español.=Je sais parler un peu espagnol.
tip|**saber** = savoir (une info, un savoir-faire) ; **conocer** = connaître (une personne, un lieu).`},
{id:'ser-estar-hay',title:'Ser, estar ou hay ?',icon:'⚖️',step:3,units:[6,8,9,19],body:`p|**Ser** et **estar** veulent dire « être » : ser décrit ce qu'est une chose (durable), estar son état ou sa place. **Hay** = il y a.
t|Ser|Estar|Hay
r|identité, origine, métier|état, humeur|existence
r|caractère, matière|lieu d'une chose précise|quantité
r|heure, date|résultat d'une action|chose nouvelle
l|**hay** + un, una, dos, mucho… : on annonce qu'une chose existe.
l|**está / están** + el, la, mi… : on dit où se trouve une chose connue.
ex|La mesa es de madera.=La table est en bois.
ex|Estoy muy feliz hoy.=Je suis très heureux aujourd'hui.
ex|La puerta está cerrada.=La porte est fermée.
ex|Hay un mercado en mi calle.=Il y a un marché dans ma rue.
ex|¿Dónde está la estación de tren?=Où est la gare ?
tip|**Hay** est invariable : hay un mercado, hay cien personas.`},
{id:'gustar',title:'Gustar, encantar, doler',icon:'❤️',step:3,units:[3,8,12,15],body:`p|**Gustar** fonctionne à l'envers : la chose aimée est le sujet. **Me gusta** = ça me plaît.
t|Pronom|Une chose|Plusieurs choses
r|me (à moi)|me gusta|me gustan
r|te (à toi)|te gusta|te gustan
r|le (à lui, elle, vous)|le gusta|le gustan
r|nos (à nous)|nos gusta|nos gustan
r|os (à vous)|os gusta|os gustan
r|les (à eux, à vous)|les gusta|les gustan
l|Même schéma : **encantar** (adorer), **doler** (faire mal), **interesar**, **parecer**.
l|Suivi d'un verbe, toujours au singulier : **me gusta jugar**.
ex|Me gusta mucho esta canción.=J'aime beaucoup cette chanson.
ex|Me encanta el queso español.=J'adore le fromage espagnol.
ex|No me gustan las arañas.=Je n'aime pas les araignées.
ex|Me duele la cabeza desde esta mañana.=J'ai mal à la tête depuis ce matin.
ex|Me duelen las piernas después de correr.=J'ai mal aux jambes après avoir couru.
tip|Pour le corps, article et non possessif : **me duele la cabeza** (pas « mi cabeza »).`},
{id:'pronominaux',title:'Verbes pronominaux',icon:'🪞',step:3,units:[1,5,34],body:`p|Un verbe pronominal se conjugue avec un pronom placé devant le verbe : **me llamo** = je m'appelle.
t|Sujet|llamarse|levantarse
r|yo|me llamo|me levanto
r|tú|te llamas|te levantas
r|él, ella, usted|se llama|se levanta
r|nosotros|nos llamamos|nos levantamos
r|vosotros|os llamáis|os levantáis
r|ellos, ustedes|se llaman|se levantan
l|À l'infinitif, le pronom se colle à la fin : **levantarse**, ¿Puedo sentarme aquí?
l|Certains changent de sens : **ir** (aller) → **irse** (partir) ; **quedar** → **quedarse** (rester).
ex|Hola, me llamo Ana.=Bonjour, je m'appelle Ana.
ex|¿Cómo te llamas?=Comment t'appelles-tu ?
ex|Me levanto a las siete.=Je me lève à sept heures.
ex|Me levanto, me baño y me visto en diez minutos.=Je me lève, me douche et m'habille en dix minutes.
ex|Mi prima se casa el año que viene.=Ma cousine se marie l'année prochaine.
tip|Avec le corps, pas de possessif : **me lavo las manos** = je me lave les mains.`},
{id:'ir-a',title:'Futur proche : ir a + infinitif',icon:'🔜',step:3,units:[3,5,18],body:`p|Pour un projet ou un futur proche : **ir a + infinitif**, exactement comme « aller + infinitif ».
t|Sujet|ir a
r|yo|voy a
r|tú|vas a
r|él, ella, usted|va a
r|nosotros|vamos a
r|vosotros|vais a
r|ellos, ustedes|van a
l|N'oublie pas le **a** : voy **a** comer.
l|**vamos a + infinitif** peut aussi vouloir dire « allons… » (proposition).
ex|Voy a pedir pollo con arroz.=Je vais commander du poulet avec du riz.
ex|Voy a hacer la compra.=Je vais faire les courses.
ex|Mañana va a llover todo el día.=Demain il va pleuvoir toute la journée.
ex|¿Qué vas a hacer después del trabajo?=Que vas-tu faire après le travail ?
ex|Vamos a bailar esta noche.=Nous allons danser ce soir.
tip|Si tu hésites pour parler du futur, **ir a + infinitif** marche presque toujours.`},
{id:'por-para',title:'Por ou para ?',icon:'🎯',step:5,units:[9,15,21],body:`p|Les deux se traduisent souvent par « pour », mais leur sens est différent.
t|Para|Por
r|but : pour + infinitif|cause : à cause de, grâce à
r|destination, destinataire|chemin, moyen : par
r|échéance|moment de la journée, fréquence
r|opinion : **para mí**|échange : **gracias por**, prix
ex|Necesito un billete para Barcelona.=J'ai besoin d'un billet pour Barcelone.
ex|Voy a ahorrar dinero para comprar un coche.=Je vais économiser de l'argent pour acheter une voiture.
ex|Mil gracias por tu ayuda.=Mille mercis pour ton aide.
ex|Por la tarde voy al gimnasio.=L'après-midi je vais à la salle de sport.
ex|Envié el informe por correo electrónico.=J'ai envoyé le rapport par e-mail.
tip|**Para** regarde vers le but (→), **por** vers la cause ou le chemin.`},
{id:'passe-compose',title:'Passé composé (he comido)',icon:'✅',step:5,units:[9,30,35],body:`p|Le **pretérito perfecto** = **haber** au présent + participe passé. En Espagne, on l'emploie pour un passé lié au présent : aujourd'hui, cette semaine, déjà, jamais.
t|Sujet|haber
r|yo|he
r|tú|has
r|él, ella, usted|ha
r|nosotros|hemos
r|vosotros|habéis
r|ellos, ustedes|han
l|Participe : **-ar → -ado** (hablado), **-er, -ir → -ido** (comido, vivido).
l|Irréguliers : hecho (hacer), dicho (decir), visto (ver), puesto (poner), roto, escrito, vuelto, abierto.
l|Toujours **haber** (jamais ser), et rien entre haber et le participe.
ex|He perdido mi maleta.=J'ai perdu ma valise.
ex|Los precios han subido este año.=Les prix ont augmenté cette année.
ex|Todavía no he recibido tu respuesta.=Je n'ai pas encore reçu ta réponse.
tip|Avec **hoy, este año, ya, todavía no, nunca**, on utilise surtout ce temps.`},
{id:'indefinido',title:'Passé simple (comí, fui)',icon:'📅',step:7,units:[7,17,32],body:`p|Le **pretérito indefinido** raconte une action terminée à un moment précis : ayer, anoche, el año pasado. On le traduit en général par le passé composé.
t|Sujet|-ar (viajar)|-er, -ir (comer)
r|yo|viajé|comí
r|tú|viajaste|comiste
r|él, ella, usted|viajó|comió
r|nosotros|viajamos|comimos
r|vosotros|viajasteis|comisteis
r|ellos, ustedes|viajaron|comieron
l|**ser** et **ir** ont la même forme : fui, fuiste, fue, fuimos, fuisteis, fueron.
l|Autres irréguliers : hacer → **hice, hizo** ; tener → **tuve** ; estar → **estuve**.
ex|Ayer comí paella en un restaurante nuevo.=Hier j'ai mangé de la paella dans un nouveau restaurant.
ex|El año pasado viajamos a Perú.=L'année dernière nous avons voyagé au Pérou.
ex|Ayer fui al cine.=Hier je suis allé au cinéma.
ex|¿Qué hiciste el fin de semana?=Qu'as-tu fait ce week-end ?
ex|La semana pasada estuve enfermo.=La semaine dernière j'ai été malade.
tip|L'accent change tout : **hablo** (je parle) ≠ **habló** (il a parlé).`},
{id:'imparfait',title:'Imparfait ou passé simple ?',icon:'🕰️',step:7,units:[17,39],body:`p|L'**imperfecto** décrit le décor, les habitudes, ce qui durait. L'**indefinido** raconte les actions ponctuelles qui font avancer l'histoire.
t|Sujet|-ar (jugar)|-er, -ir (vivir)
r|yo|jugaba|vivía
r|tú|jugabas|vivías
r|él, ella, usted|jugaba|vivía
r|nosotros|jugábamos|vivíamos
r|vosotros|jugabais|vivíais
r|ellos, ustedes|jugaban|vivían
l|Seulement 3 irréguliers : **ser → era**, **ir → iba**, **ver → veía**. Tener est régulier : **tenía**.
l|Imparfait : antes, siempre, todos los días, cuando era pequeño. Indefinido : ayer, un día, de repente.
ex|Cuando era pequeño, vivía en un pueblo.=Quand j'étais petit, je vivais dans un village.
ex|Antes fumaba, pero lo dejé.=Avant je fumais, mais j'ai arrêté.
ex|Jugábamos en la calle hasta la noche.=Nous jouions dans la rue jusqu'à la nuit.
ex|Tuve un accidente cuando era joven.=J'ai eu un accident quand j'étais jeune.
tip|Même logique qu'en français : imparfait = « je vivais », indefinido = « j'ai vécu ».`},
{id:'futur-conditionnel',title:'Futur simple et conditionnel',icon:'🔮',step:8,units:[3,18,27],body:`p|On garde l'**infinitif entier** et on ajoute la terminaison (la même pour -ar, -er, -ir).
t|Sujet|Futur|Conditionnel
r|yo|hablaré|hablaría
r|tú|hablarás|hablarías
r|él, ella, usted|hablará|hablaría
r|nosotros|hablaremos|hablaríamos
r|vosotros|hablaréis|hablaríais
r|ellos, ustedes|hablarán|hablarían
l|Radicaux irréguliers : tener → **tendr-**, venir → **vendr-**, salir → **saldr-**, poder → **podr-**, hacer → **har-**, decir → **dir-**.
l|Le conditionnel sert surtout à demander poliment : **me gustaría**, **¿podría…?**
ex|Algún día hablaré español con fluidez.=Un jour je parlerai espagnol couramment.
ex|Pronto tendremos un bebé.=Bientôt nous aurons un bébé.
ex|Mis padres vendrán a cenar el sábado.=Mes parents viendront dîner samedi.
ex|Me gustaría un vaso de agua.=Je voudrais un verre d'eau.
ex|¿Podría ayudarme con esta maleta?=Pourriez-vous m'aider avec cette valise ?
tip|Après **cuando**, pas de futur mais le subjonctif : Cuando termine la carrera, buscaré trabajo.`},
{id:'pronoms-cod-coi',title:'Pronoms compléments (lo, le, se lo)',icon:'🎁',step:9,units:[17,26,27,34],body:`p|Les pronoms compléments se placent **devant le verbe conjugué**, ou se collent à la fin d'un infinitif ou d'un impératif.
t|Personne|COD|COI
r|moi|me|me
r|toi|te|te
r|lui, elle, vous (usted)|lo, la|le
r|nous|nos|nos
r|vous (vosotros)|os|os
r|eux, elles, vous (ustedes)|los, las|les
l|Avec deux pronoms, le COI passe d'abord : **me lo**, **te la**.
l|**le / les** devant lo, la → **se** : **se lo** (le lui, le leur, vous le).
ex|Te llamé tres veces, pero no contestaste.=Je t'ai appelé trois fois, mais tu n'as pas répondu.
ex|Mi abuela me llama todos los domingos.=Ma grand-mère m'appelle tous les dimanches.
ex|Ella le dio las gracias y le envió un regalo.=Elle l'a remercié et lui a envoyé un cadeau.
ex|Se lo agradezco mucho.=Je vous en remercie beaucoup.
ex|Las sábanas están sucias, hay que cambiarlas.=Les draps sont sales, il faut les changer.
tip|Deux places possibles avec un infinitif : **¿Me puedes dar…?** = ¿Puedes darme…?`},
{id:'subjonctif-connecteurs',title:'Subjonctif et connecteurs',icon:'🔗',step:12,units:[25,35,40],body:`p|Le **subjonctif présent** exprime un souhait, un doute ou un futur après cuando. On part du « yo » du présent et on inverse la voyelle : **-ar → -e**, **-er, -ir → -a** (hablo → hable, como → coma, tengo → tenga).
h|Quand l'utiliser
l|souhait : **quiero que**, **ojalá**, **que tengas…**
l|doute : **no creo que**, **quizás**
l|futur après **cuando**, **en cuanto** ; hypothèse après **aunque** (même si)
l|irréguliers : ser → **sea**, ir → **vaya**, estar → **esté**
h|Connecteurs utiles
l|**pero** (mais), **sin embargo** (pourtant), **además** (en plus), **por eso** (c'est pour ça que), **aunque** (bien que, même si)
ex|Ojalá todo se resuelva pronto.=Pourvu que tout se règle bientôt.
ex|No creo que sea posible.=Je ne crois pas que ce soit possible.
ex|Quiero ser médico cuando sea mayor.=Je veux être médecin quand je serai grand.
ex|Hay que trabajar mucho; sin embargo, vale la pena.=Il faut beaucoup travailler ; pourtant, ça vaut la peine.
ex|Aunque llueva, iremos a la excursión.=Même s'il pleut, nous irons à l'excursion.
tip|**Aunque + indicatif** = bien que (fait réel) ; **aunque + subjonctif** = même si (hypothèse).`},
];

/* ============ MOTEUR DE RÉPÉTITION ESPACÉE : FSRS-5 (l'algorithme par défaut d'Anki) ============
   Chaque carte a une stabilité s (nombre de jours avant de retomber à 90 % de chances de s'en souvenir)
   et une difficulté d (1 à 10). L'intervalle est calculé pour viser le taux de mémorisation choisi. */
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-.5,FACTOR=19/81,MAXIV=3650;
const clampD=d=>Math.min(10,Math.max(1,d));
const initD=G=>clampD(W[4]-Math.exp(W[5]*(G-1))+1);
const retr=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
const nextD=(d,G)=>clampD(W[7]*initD(4)+(1-W[7])*(d-W[6]*(G-3)*(10-d)/9));
const sRecall=(d,s,R,G)=>s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp(W[10]*(1-R))-1)*(G===2?W[15]:1)*(G===4?W[16]:1));
const sForget=(d,s,R)=>Math.min(s,W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp(W[14]*(1-R)));
const sShort=(s,G)=>s*Math.exp(W[17]*(G-3+W[18]));

const KEY='espanki-v1';
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const dstr=n=>new Date(n*864e5).toISOString().slice(0,10);
const newDaily=t=>({day:t,xp:0,reviewed:0,newDone:0,goalHit:false,quests:[],chest:0});
const defaults=()=>({cards:{},custom:[],xp:0,streak:0,lastDay:0,best:0,freezes:1,frozen:{},mistakes:{},
  daily:newDaily(0),hist:{},badges:{},stats:{reviews:0,correct:0,oral:0},stories:{},gram:{},
  set:{newPerDay:10,lesson:20,goal:50,mode:'mixed',dir:'auto',order:'smart',retention:'0.9',pics:'0.4',sound:true,speak:true,oral:true,voice:'',rate:'0.85'}});
/* convertit une carte de l'ancien moteur (SM-2) vers FSRS sans perdre la progression */
function migrateCard(c){
  if(!c||c.state==='new'||c.s!=null)return c;
  if(c.state==='review'){const iv=Math.max(1,c.interval||1);c.s=iv;c.d=clampD(10.5-2.2*(c.ease||2.5));c.last=(c.due||today())-iv}
  else{c.s=W[2];c.d=initD(3);c.last=today()}
  return c;
}
function norm(s){
  const d=defaults();if(!s||typeof s!=='object')return d;
  Object.assign(d,s,{set:Object.assign(d.set,s.set||{}),daily:Object.assign(d.daily,s.daily||{}),stats:Object.assign(d.stats,s.stats||{})});
  for(const k in d.cards){if(k[0]==='u')delete d.cards[k];else migrateCard(d.cards[k])}
  if(!d.frozen||typeof d.frozen!=='object')d.frozen={};
  if(!d.mistakes||typeof d.mistakes!=='object')d.mistakes={};
  if(typeof d.freezes!=='number')d.freezes=1;
  if(!d.stories||typeof d.stories!=='object')d.stories={};
  if(!d.gram||typeof d.gram!=='object')d.gram={};
  return d;
}
let storageOK=true;
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){storageOK=false;return defaults()}}
/* ---- sauvegarde : navigateur + serveur local (progress.json) + fichier lié ---- */
let srvMode=false,fileHandle=null,fileNeedsPerm=false,saveTimer=null,syncReady=false;
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}clearTimeout(saveTimer);saveTimer=setTimeout(syncOut,500)}
async function syncOut(){
  if(!syncReady)return;
  const body=JSON.stringify(S);
  try{
    if(srvMode)await fetch('/api/progress',{method:'POST',headers:{'Content-Type':'application/json'},body});
    else if(fileHandle&&!fileNeedsPerm){const w=await fileHandle.createWritable();await w.write(body);await w.close()}
  }catch(e){if(fileHandle&&!srvMode){fileNeedsPerm=true;if(typeof L==='undefined'||!L)render()}}
}
function adopt(remote){
  const rr=remote&&remote.stats?remote.stats.reviews||0:0,lr=S.stats.reviews||0;
  /* la sauvegarde la plus avancée gagne ; à égalité, la plus récente */
  if(remote&&typeof remote==='object'&&(rr>lr||(rr===lr&&(remote.savedAt||0)>(S.savedAt||0)))){
    S=norm(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    setTimeout(()=>toast('💾 Progression restaurée depuis la sauvegarde'),300);return true}
  return false;
}
const idbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('espanki',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'handle');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(){const db=await idbOpen();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get('handle');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function readHandle(){
  const txt=await (await fileHandle.getFile()).text();
  if(txt.trim()){try{adopt(JSON.parse(txt))}catch(e){}}
  fileNeedsPerm=false;syncReady=true;await syncOut();
}
async function initSync(){
  if(!SHARED&&location.protocol!=='file:')try{
    const r=await fetch('/api/progress',{cache:'no-store'});
    if(r.ok&&(r.headers.get('content-type')||'').includes('json')){
      srvMode=true;adopt(await r.json());syncReady=true;rollDay();await syncOut();render();return}
  }catch(e){}
  if(window.showOpenFilePicker){
    try{const hd=await idbGet();
      if(hd){fileHandle=hd;
        if(await hd.queryPermission({mode:'readwrite'})==='granted')await readHandle();else fileNeedsPerm=true}
    }catch(e){}
  }
  if(!fileNeedsPerm)syncReady=true;rollDay();render();
}
const PICK={types:[{description:'Sauvegarde Espanki',accept:{'application/json':['.json']}}]};
async function linkNew(){
  try{fileHandle=await showSaveFilePicker(Object.assign({suggestedName:'espanki-progression.json'},PICK));
    await idbSet(fileHandle).catch(()=>{});fileNeedsPerm=false;await syncOut();toast('💾 Sauvegarde automatique activée');render()}catch(e){fileHandle=null}
}
async function linkOld(){
  try{const [hd]=await showOpenFilePicker(PICK);
    if(await hd.requestPermission({mode:'readwrite'})!=='granted')return;
    fileHandle=hd;await idbSet(hd).catch(()=>{});await readHandle();toast('💾 Sauvegarde reliée');render()}catch(e){}
}
async function reconnect(){
  try{if(await fileHandle.requestPermission({mode:'readwrite'})==='granted'){await readHandle();toast('💾 Sauvegarde reconnectée');render()}}catch(e){}
}
function backupCard(){
  const can=!!window.showSaveFilePicker;
  if(srvMode)return `<div class="card" style="margin-bottom:12px;padding:10px 14px">💾 Sauvegarde automatique active <span class="mute">(fichier progress.json)</span></div>`;

  if(fileHandle&&fileNeedsPerm)return `<div class="card" style="margin-bottom:12px;border-color:var(--orange)"><b>💾 Reconnecte ta sauvegarde</b><p class="mute" style="margin:6px 0 10px">Le navigateur demande une autorisation à chaque ouverture.</p><button class="btn blue" data-act="reconnect">Reconnecter</button></div>`;
  return `<div class="card" style="margin-bottom:12px;border-color:var(--orange)"><b>⚠️ Ta progression n'est pas sauvegardée durablement</b>
    <p class="mute" style="margin:6px 0 10px">${storageOK?'Elle reste uniquement dans la mémoire de ce navigateur, qui peut l\'effacer.':'Ce navigateur bloque le stockage : rien n\'est conservé.'} Choisis une solution :</p>

    <button class="btn ghost" data-act="exportJson">Exporter une copie maintenant</button></div>
    ${SHARED?'':'<p class="mute" style="margin:10px 0 0;font-size:13px">Astuce : lance l\'appli avec <b>Lancer Espanki.bat</b>, la sauvegarde est alors 100 % automatique.</p>'}</div>`;
}

function rollDay(){
  const t=today();
  if(S.daily.day!==t){S.daily=newDaily(t);save()}
  if(!Array.isArray(S.daily.quests)||!S.daily.quests.length){S.daily.quests=makeQuests();S.daily.chest=0;save()}
}
function allDefs(){
  const out=[];
  for(const u of UNITS)u.words.split('\n').forEach((l,i)=>{const [es,fr]=l.split('=');out.push({id:`s${u.id}_${i}`,es:es.trim(),fr:fr.trim(),u:u.id})});
  for(const u of PICS)u.words.split('\n').forEach((l,i)=>{const [es,fr,img]=l.split('=').map(s=>s.trim());out.push({id:`p${u.id}_${i}`,es,fr,u:u.id,pic:true,img:img||picSlug(es)})});
  for(const c of S.custom)out.push({id:c.id,es:c.es,fr:c.fr,u:99});
  return out;
}

const picSlug=es=>es.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^(el|la|los|las|un|una)\s+/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const streakNow=()=>{const t=today();return S.lastDay&&S.lastDay>=t-1-(S.freezes||0)?S.streak:0};
function touchDay(){
  const t=today();if(S.lastDay===t)return;
  const gap=t-S.lastDay-1;
  if(S.lastDay&&S.streak>0&&gap>0&&gap<=S.freezes){
    S.freezes-=gap;for(let i=1;i<=gap;i++)S.frozen[dstr(S.lastDay+i)]=1;

  }else S.streak=gap===0?S.streak+1:1;

function fmtDays(d){return d<1?'<1 j':d<30?d+' j':d<365?Math.round(d/30)+' mois':(d/365).toFixed(1)+' an'}
const retention=()=>Math.min(.97,Math.max(.7,+S.set.retention||.9));
const ivFor=s=>Math.min(MAXIV,Math.max(1,Math.round(s/FACTOR*(Math.pow(retention(),1/DECAY)-1))));
function memNext(c,G,t){
  if(c.state==='new'||c.s==null)return {s:W[G-1],d:initD(G)};
  const el=Math.max(0,t-(c.last==null?t:c.last));
  if(el===0)return {s:Math.max(.1,sShort(c.s,G)),d:nextD(c.d,G)};
  const R=retr(el,c.s);
  return {s:Math.max(.1,G===1?sForget(c.d,c.s,R):sRecall(c.d,c.s,R,G)),d:nextD(c.d,G)};
}
/* résultat de chaque note r (0 Encore, 1 Difficile, 2 Bien, 3 Facile) sans rien modifier */
function plans(c){
  const t=today();
  const p=[0,1,2,3].map(r=>{
    const m=memNext(c,r+1,t),o={s:m.s,d:m.d,state:c.state==='new'?'learn':c.state,step:c.state==='new'?0:(c.step||0),requeue:0,interval:0,lapse:false};
    if(o.state==='learn'){
      if(r===0){o.step=0;o.requeue=3}
      else if(r===1)o.requeue=5;
      else if(r===2&&o.step===0){o.step=1;o.requeue=6}
      else{o.state='review';o.step=0;o.interval=ivFor(m.s)}
    }else if(r===0){o.state='learn';o.step=1;o.requeue=3;o.lapse=true}
    else o.interval=ivFor(m.s);
    return o;
  });
  const g=i=>p[i].state==='review'&&!p[i].requeue;
  if(g(1)&&g(2))p[2].interval=Math.max(p[2].interval,p[1].interval+1);
  if(g(2)&&g(3))p[3].interval=Math.max(p[3].interval,p[2].interval+1);
  return p;
}
function preview(c,r){const o=plans(c)[r];return o.requeue?'↻ leçon':fmtDays(o.interval)}
function logReview(r){

function applyRating(id,r){
  const c=getCard(id),o=plans(c)[r],t=today();

  Object.assign(c,{s:o.s,d:o.d,last:t,state:o.state,step:o.step});delete c.placed;
  if(o.lapse)c.lapses++;
  if(o.state==='review'&&!o.requeue){
    let iv=o.interval;
    if(iv>=3)iv=Math.max(2,iv+Math.round((Math.random()*2-1)*Math.max(1,iv*.05)));  /* léger flou pour étaler les révisions */
    c.interval=iv;c.due=t+iv;
  }
  c.reps++;S.cards[id]=c;
  logReview(r);
  return {requeue:o.requeue};
}

let actx;
function tone(seq){
  if(!S.set.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    for(const [f,d,type] of seq){const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.8}
  }catch(e){}
}
const sndOk=()=>tone([[659,.1],[880,.16]]);
const sndBad=()=>tone([[220,.18,'square'],[160,.25,'square']]);
const sndWin=()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]);
const esVoices=()=>('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('es'));
function voiceScore(v){
  return (/natural/i.test(v.name)?100:0)+(/online/i.test(v.name)?60:0)+(/google/i.test(v.name)?40:0)
    +(/elvira|alvaro|álvaro|dalia|jorge|lucia|lucía|sonia|paulina|sabina/i.test(v.name)?10:0)+(v.lang.toLowerCase().replace('_','-')==='es-es'?3:0);
}
function pickVoice(){
  const vs=esVoices();
  if(S.set.voice){const m=vs.find(v=>v.name===S.set.voice);if(m)return m}
  return vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
/* Audio neuronal pré-généré (dossier audio/, voix Elvira, Espagne) ; repli sur la voix du navigateur.
   Un seul lecteur audio réutilisé + un jeton : impossible d'avoir deux voix en même temps. */
/* version partagée (un seul fichier) : les audios et images sont intégrés dans window.MEDIA */
/* version en ligne (GitHub Pages) ou fichier partagé : pas de serveur local ni de fichier de sauvegarde */
const SHARED=!!window.MEDIA||location.protocol==='https:';
const mediaUrl=p=>window.MEDIA&&MEDIA[p]?'data:'+(p.endsWith('.mp3')?'audio/mpeg':'image/webp')+';base64,'+MEDIA[p]:p;
function fnv(s){let x=0x811c9dc5;for(const b of new TextEncoder().encode(s)){x^=b;x=Math.imul(x,0x01000193)>>>0}return x.toString(16).padStart(8,'0')}
const player=new Audio();let spkTok=0;
const stopTTS=()=>{try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}};
function speak(t,rate){
  const tok=++spkTok;
  try{player.pause()}catch(e){}
  stopTTS();
  const pr=Math.min(1.25,Math.max(.6,rate?(rate<.7?.7:rate/.85):(+S.set.rate||.85)/.85));
  player.onplaying=()=>{if(tok===spkTok)stopTTS()};
  player.onerror=()=>{if(tok===spkTok){spkTok++;ttsSpeak(t,rate)}};
  player.src=mediaUrl('audio/'+fnv(t.trim())+'.mp3');
  player.defaultPlaybackRate=pr;player.playbackRate=pr;
  const p=player.play();
  if(p&&p.catch)p.catch(err=>{if(tok===spkTok&&err&&err.name!=='AbortError'){spkTok++;ttsSpeak(t,rate)}});
}
function ttsSpeak(t,rate){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[¿¡]/g,''));
    const v=pickVoice();u.lang=v?v.lang:'es-ES';if(v)u.voice=v;
    u.rate=rate||(+S.set.rate||.85);u.pitch=1;speechSynthesis.speak(u)}catch(e){}
}

const TQ=[];let tBusy=false;
function toast(html,ms=2600){if(TQ.length<6)TQ.push([html,ms]);if(!tBusy)nextToast()}

function confetti(n=140){
  const cv=$('#confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*7,c:cols[Math.random()*6|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function go(){cx.clearRect(0,0,cv.width,cv.height);
    for(const p of ps){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()}
    if(++f<110)requestAnimationFrame(go);else cx.clearRect(0,0,cv.width,cv.height)})();
}

function makeQuests(){
  const m=S.set.mode,mixed=m==='mixed',c=counts(),cards=Object.values(S.cards);
  const known=cards.filter(x=>x.state==='review'&&x.interval>=3).length,seen=cards.filter(x=>x.state!=='new').length,mist=mistakeIds().length;
  const ok={accuracy:1,combo:1,newc:c.newAvail>=3,typed:(mixed&&known>=5)||m==='type',order:(mixed&&seen>=5)||m==='order',
    cloze:(mixed&&seen>=5)||m==='cloze',listen:(mixed&&known>=5)||m==='listen',fix:mist>=2,pics:picShare()>0,xp:1,lessons:1,correct:1,
    story:STORIES.some(s=>storyOpen(s)&&!S.stories[s.id]),oral:(mixed||m==='speak')&&known>=5&&S.set.oral!==false&&!!(SRec||canRecord())};

/* ============ LEÇON ============ */
let L=null;
const toks=s=>(s.toLowerCase().match(/[\p{L}]+/gu)||[]);
let _df=null,_dfN=0;
function docFreq(defs){
  if(_df&&_dfN===defs.length)return _df;
  _df={};for(const d of defs)for(const w of new Set(toks(d.es)))_df[w]=(_df[w]||0)+1;
  _dfN=defs.length;return _df;
}
/* mots-outils jamais retirés dans « mot manquant » ni ajoutés comme pièges */
const STOP=new Set('de la el que en los las por con una del para es un se no me mi te lo le y a al su sus muy más mis tu tus yo él ella nos les o e pero como hay son ya si sí'.split(' '));
let _voc=null,_vocN=0;
function vocabList(){
  const defs=allDefs();if(_voc&&_vocN===defs.length)return _voc;
  const set=new Set();for(const d of defs)for(const w of toks(d.es))if(w.length>=3&&!STOP.has(w))set.add(w);
  _vocN=defs.length;return _voc=[...set];
}
/* découpe une phrase en morceaux : ponctuation avant / mot / ponctuation après */
const chunks=es=>es.trim().split(/\s+/).map(raw=>{const m=raw.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);return {raw,pre:m[1],w:m[2],post:m[3]}});
const deacc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function makeCloze(def){
  const ch=chunks(def.es),df=docFreq(allDefs());
  const cand=ch.map((c,i)=>({i,lw:c.w.toLowerCase()})).filter(x=>x.lw.length>=3&&!STOP.has(x.lw)&&/\p{L}/u.test(x.lw));
  if(!cand.length)return null;
  cand.sort((a,b)=>(df[a.lw]||1)-(df[b.lw]||1));
  const pick=cand[Math.random()*Math.ceil(cand.length*.6)|0],word=ch[pick.i].w,lw=pick.lw,end=deacc(lw).slice(-2);
  const isCap=word[0]!==word[0].toLowerCase(),cap=s=>isCap?s[0].toUpperCase()+s.slice(1):s;
  const wrong=vocabList().filter(w=>deacc(w)!==deacc(lw))
    .map(w=>({w,sc:(deacc(w).slice(-2)===end?2:0)-Math.abs(w.length-lw.length)*.5+Math.random()*1.5}))
    .sort((a,b)=>b.sc-a.sc).slice(0,3).map(x=>cap(x.w));
  return {ch,idx:pick.i,word,opts:wrong.length===3?shuffle([word,...wrong]):null};
}
/* Choisit n nouvelles phrases "i+1" : celles dont presque tous les mots sont déjà connus,
   en commençant par les plus courtes et les plus courantes. */
function pickNew(n,defs){
  const cand=defs.filter(d=>{const c=S.cards[d.id];return !d.pic&&(!c||c.state==='new')});
  if(S.set.order==='theme')return cand.slice(0,n).map(d=>d.id);
  const df=docFreq(defs),known=new Set();
  for(const d of defs){const c=S.cards[d.id];if(c&&c.state!=='new')toks(d.es).forEach(w=>known.add(w))}
  const out=[],left=cand.map(d=>({d,t:toks(d.es)}));
  while(out.length<n&&left.length){
    let bi=0,bc=1e9;
    for(let i=0;i<left.length;i++){
      const {t}=left[i];let c=.12*t.length;
      for(const w of new Set(t))if(!known.has(w))c+=1+1.5/Math.sqrt(df[w]||1);
      c+=Math.random()*.3;
      if(c<bc){bc=c;bi=i}
    }
    const [x]=left.splice(bi,1);out.push(x.d.id);x.t.forEach(w=>known.add(w));
  }
  return out;
}
/* nouveaux mots de l'imagier : thème par thème, dans l'ordre */
function pickPics(n,defs){return defs.filter(d=>{const c=S.cards[d.id];return d.pic&&(!c||c.state==='new')}).slice(0,n).map(d=>d.id)}
function buildQueue(bonus=0){
  rollDay();const t=today(),due=[],defs=allDefs(),sh=picShare();let nS=0,nP=0;
  for(const d of defs){const c=S.cards[d.id];
    if(!c||c.state==='new'){if(d.pic)nP++;else nS++}else if(c.state==='learn'||c.due<=t)due.push(d.id)}
  if(sh===0)nP=0;if(sh===1)nS=0;
  const nwCount=nS+nP;
  shuffle(due);
  const size=S.set.lesson,avail=Math.max(0,S.set.newPerDay-S.daily.newDone)+bonus;
  let nNew=Math.min(avail,nwCount,Math.ceil(size/3));
  const dueTake=Math.min(due.length,size-nNew);
  nNew=Math.min(avail,nwCount,size-dueTake);
  let wP=Math.min(nP,Math.round(nNew*sh));const wS=Math.min(nS,nNew-wP);wP=Math.min(nP,nNew-wS);
  return shuffle([...due.slice(0,dueTake),...pickNew(wS,defs),...pickPics(wP,defs)]);
}

function defOf(id){return allDefs().find(d=>d.id===id)}
/* choix de l'exercice en mode mixte, selon le niveau de la carte */
function pickType(c,dir){
  if(c.state==='new')return 'qcm';
  const x=Math.random();
  if(c.state==='learn')return x<.35?'qcm':x<.6?'flip':x<.82?'order':'cloze';
  if(dir==='fr-es')return x<.35?'type':x<.55?'listen':x<.75?'cloze':x<.9?'order':'flip';
  return x<.4?'flip':x<.6?'qcm':x<.8?'cloze':'order';
}
const needsInput=k=>k.type==='type'||k.type==='listen'||k.type==='pict'||(k.type==='cloze'&&k.czMode==='type');
/* exercices de l'imagier : pici (mot → image), picl (son → image), picw (image → mot), pict (image → écrire), flip */
function picType(c,known){
  const x=Math.random();
  if(c.state==='new')return 'pici';
  if(c.state==='learn')return x<.4?'picw':x<.7?'picl':'pici';
  if(!known)return x<.3?'picw':x<.6?'picl':x<.85?'pict':'flip';
  return x<.5?'pict':x<.7?'picl':'flip';
}
const picHtml=d=>d.img[0]==='#'?`<span class="swatch" style="background:${d.img}"></span>`:`<img src="${mediaUrl('img/'+d.img+'.webp')}" alt="" draggable="false" onerror="this.outerHTML='<span class=noimg>🖼️</span>'">`;
const picMsg=d=>`<b>${esc(d.es)}</b> = ${esc(d.fr)}`;
const hasArticle=es=>/^(el|la|los|las|un|una)\s/i.test(es);
function judgePic(typed,answer){
  const n=s=>s.toLowerCase().replace(/[¿?¡!.,;:"…]/g,'').replace(/\s+/g,' ').trim(),art=/^(el|la|los|las|un|una|unos|unas)\s+/;
  const u=n(typed||''),a=n(answer);
  if(!u)return 'wrong';
  if(u===a)return 'exact';
  if(deacc(u)===deacc(a))return 'accent';
  const ub=deacc(u.replace(art,'')),ab=deacc(a.replace(art,''));
  if(art.test(a)&&ub===ab)return 'article';
  if(ab.length>=5&&lev(ub,ab)<=1)return 'close';
  return 'wrong';
}
function nextCard(){
  if(!L.queue.length)return endLesson();
  const id=L.queue.shift(),def=defOf(id);
  if(!def)return nextCard();
  const c=getCard(id);
  const known=c.state==='review'&&c.interval>=3;
  const dir=S.set.dir==='auto'?(known?'fr-es':'es-fr'):S.set.dir==='both'?(Math.random()<.5?'es-fr':'fr-es'):S.set.dir;
  if(def.pic)return nextPicCard(id,def,c,known);
  let type=S.set.mode==='mixed'?pickType(c,dir):S.set.mode;
  /* exercices oraux : de temps en temps sur les phrases déjà apprises (ou toujours en mode « Oral ») */
  const audioOk=def.u!==99;
  if(type==='speak'){const sp=canSpeakEx(),sh=canShadow()&&audioOk;type=sp&&(!sh||Math.random()<.7)?'speak':sh?'shadow':'flip'}
  else if(S.set.mode==='mixed'&&audioOk&&c.state==='review'&&!L.practice){const x=Math.random();
    if(canSpeakEx()&&x<.12)type='speak';else if(canShadow()&&x>.92)type='shadow'}
  const k={id,def,card:c,dir,phase:'ask',t0:Date.now(),result:null,choices:null};
  if(type==='speak'){k.spMode=dir==='fr-es'?'say':'repeat';k.answer=def.es}
  if(type==='shadow'){k.answer=def.es;refBuffer(def.es).then(b=>{k.ref=b;if(L&&L.cur===k&&k.phase==='ask')drawWaves(k)})}
  if(type==='order'){
    const tk=chunks(def.es).map(x=>x.w).filter(Boolean);
    if(tk.length<2)type='qcm';
    else{const low=new Set(tk.map(w=>w.toLowerCase()));
      const extra=shuffle(vocabList().filter(w=>!low.has(w))).slice(0,tk.length<=4?2:3);
      Object.assign(k,{target:tk,bank:shuffle([...tk,...extra]).map(w=>({w,used:false})),built:[],answer:def.es})}
  }
  if(type==='cloze'){
    const z=makeCloze(def),mode=known?'type':'pick';
    if(!z||(mode==='pick'&&!z.opts))type='qcm';
    else Object.assign(k,{cz:z,answer:z.word,czMode:mode,choices:mode==='pick'?z.opts:null});
  }
  if(type==='listen')k.answer=def.es;
  if(type==='qcm'||type==='flip'||type==='type'){
    k.answer=dir==='es-fr'?def.fr:def.es;
    if(type==='qcm'){
      const pool=shuffle(allDefs().filter(d=>!d.pic&&d.id!==id&&(dir==='es-fr'?d.fr:d.es)!==k.answer));
      pool.sort((a,b)=>(b.u===def.u)-(a.u===def.u)+(Math.random()-.5)*.9);
      const wrong=pool.slice(0,3).map(d=>dir==='es-fr'?d.fr:d.es);
      if(wrong.length<3)type='flip';else k.choices=shuffle([k.answer,...wrong]);
    }
  }
  k.type=type;L.cur=k;
  renderLesson();
  if(type==='listen'||type==='shadow')speak(def.es);
  else if(S.set.speak&&dir==='es-fr'&&(type==='qcm'||type==='flip'||type==='type'||(type==='speak'&&k.spMode==='repeat')))speak(def.es);
}
function nextPicCard(id,def,c,known){
  let type=picType(c,known);
  const k={id,def,card:c,dir:'es-fr',phase:'ask',t0:Date.now(),result:null,choices:null};
  const pool=shuffle(allDefs().filter(d=>d.pic&&d.id!==id&&picSlug(d.es)!==picSlug(def.es)&&d.fr!==def.fr));
  pool.sort((a,b)=>(b.u===def.u)-(a.u===def.u)+(Math.random()-.5)*.6);
  const wrong=pool.slice(0,3);
  if(wrong.length<3&&type!=='pict')type='flip';
  if(type==='pici'||type==='picl'){k.answer=id;k.choices=shuffle([id,...wrong.map(d=>d.id)])}
  else if(type==='picw'){k.answer=def.es;k.choices=shuffle([def.es,...wrong.map(d=>d.es)])}
  else k.answer=def.es;
  k.type=type;L.cur=k;
  renderLesson();
  if(type==='picl'||(type==='pici'&&S.set.speak))speak(def.es);
}
