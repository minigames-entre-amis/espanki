/* normalisation pour la saisie */
const strip=s=>s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[¿?¡!.,;:"…]/g,'').replace(/’/g,"'").trim().replace(/^(el|la|los|las|un|una|le|les|une)\s+|^l'\s*/,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function judgeTyped(input,answer){
  const alts=answer.split(/\s*[\/;]\s*/).map(strip).filter(Boolean),u=strip(input);
  if(!u)return 'wrong';
  if(alts.includes(u))return 'exact';
  if(alts.some(a=>deacc(a)===deacc(u)))return 'accent';
  if(alts.some(a=>a.length>=5&&lev(deacc(a),deacc(u))<=(a.length>=20?2:1)))return 'close';
  return 'wrong';
}
/* surligne les mots de la bonne réponse absents de ce qui a été tapé */
function diffHtml(ans,typed){
  if(!typed||!typed.trim())return esc(ans);
  const have=new Set(toks(deacc(typed)));
  return ans.split(/(\s+)/).map(p=>{const w=toks(deacc(p))[0];return w&&!have.has(w)?`<u class="miss">${esc(p)}</u>`:esc(p)}).join('');
}
function judgeAndFeedback(k){
  k.typed=$('#typein').value;const j=judgeTyped(k.typed,k.answer);
  const fr=k.type==='listen'?`<br><span style="opacity:.8">${esc(k.def.fr)}</span>`:'';
  if(j==='exact')feedback(true,cheer(),k.type==='listen'?esc(k.def.fr):'',2);
  else if(j==='accent')feedback(true,'¡Casi perfecto!','Attention aux accents : <b>'+esc(k.answer)+'</b>'+fr,2);
  else if(j==='close')feedback(true,'Presque !','Il y a une petite faute : <b>'+diffHtml(k.answer,k.typed)+'</b>'+fr,1);
  else feedback(false,oops(),'Réponse : <b>'+diffHtml(k.answer,k.typed)+'</b>'+fr,0);
}
function feedback(ok,title,msg,rating){
  const k=L.cur;
  if(k.type==='cloze')msg+=`${msg?'<br>':''}<span style="opacity:.85">${esc(k.def.fr)}</span>`;
  /* nouvelle phrase : lien vers la fiche de grammaire du thème, si elle n'a pas encore été lue */
  if(k.card.state==='new'&&!k.def.pic){const g=gramFor(k.def.u);if(g&&!S.gram[g.id])msg+=`${msg?'<br>':''}<button class="glink" data-act="gram:${g.id}">📘 Fiche : ${esc(g.title)}</button>`}
  if(rating<2&&!k.def.pic&&!L.noAI)msg+=`${msg?'<br>':''}<button class="glink" data-act="explain">🤖 Explique-moi mon erreur</button>`;
  k.phase='fb';k.result={ok,title,msg,rating};
  ok?sndOk():sndBad();
  renderLesson();
  if(!ok){$('#lbody').classList.add('shake');setTimeout(()=>$('#lbody')&&$('#lbody').classList.remove('shake'),400)}
  const sayAfter=k.def.pic||k.type==='order'||k.type==='cloze'||k.type==='speak'||(k.dir==='fr-es'&&(k.type==='qcm'||k.type==='type'));
  if(S.set.speak&&sayAfter)speak(k.def.es);
}
function commit(r){
  const k=L.cur;let requeue;stopMic();
  if(L.practice){logReview(r);requeue=r===0?3:0}
  else requeue=applyRating(k.id,r).requeue;
  if(r===0)S.mistakes[k.id]=Math.min(3,(S.mistakes[k.id]||0)+1);
  else if(L.practice&&r>=2&&S.mistakes[k.id]){if(--S.mistakes[k.id]<=0)delete S.mistakes[k.id];L.fixed++;quest('fix')}
  L.answered++;if(r>=2){L.correct++;L.combo++;L.bestCombo=Math.max(L.bestCombo,L.combo)}else{L.combo=0;if(r===0)L.errors++}
  if(r>=2)quest('correct');quest('combo',L.combo);
  if(k.result&&k.result.ok){const q={type:'typed',pict:'typed',order:'order',cloze:'cloze',listen:'listen',speak:'oral',shadow:'oral'}[k.type];if(q)quest(q)}
  if(k.def.pic&&r>=2)quest('pics');
  const gain=[2,6,10,13][r]+((r>=2&&L.combo>=5)?3:0);
  L.xp+=gain;addXP(gain);
  if(requeue){const pos=Math.min(requeue,L.queue.length);L.queue.splice(pos,0,k.id)}else L.done++;
  save();renderChips();
  checkBadges({combo:L.bestCombo});
  nextCard();
}

const gloss=w=>{const g=GLOSS[w];return g?{fr:g[0],base:g[1]||''}:null};
function wordsHtml(es){
  return String(es).split(/([\p{L}]+)/u).map((p,i)=>i%2?`<span class="w" data-w="${esc(p.toLowerCase())}">${esc(p)}</span>`:esc(p)).join('');

/* ============ ORAL : prononciation (reconnaissance vocale) et shadowing ============ */
const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const canRecord=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
const oralOn=()=>S.set.oral!==false&&!(L&&L.noMic);
const canSpeakEx=()=>oralOn()&&!!SRec;
const canShadow=()=>oralOn()&&canRecord();
const NUM_U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const NUM_T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const NUM_H=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function numEs(n){
  if(n<30)return NUM_U[n];
  if(n<100)return NUM_T[n/10|0]+(n%10?' y '+NUM_U[n%10]:'');
  if(n===100)return 'cien';
  if(n<1000)return NUM_H[n/100|0]+(n%100?' '+numEs(n%100):'');
  if(n<1e6){const m=n/1000|0;return (m===1?'mil':numEs(m)+' mil')+(n%1000?' '+numEs(n%1000):'')}
  return String(n);
}
/* mots prononcés, normalisés : minuscules, sans accents, chiffres écrits en lettres */
function sayToks(s){
  s=String(s).toLowerCase().replace(/(\d+)[.,:h](\d+)/g,'$1 $2').replace(/\d+/g,m=>' '+numEs(+m)+' ');
  return (deacc(s).match(/[a-z]+/g)||[]).map(w=>w==='uno'||w==='una'?'un':w);
}
function oralScore(target,heard){
  const t=sayToks(target),h=sayToks(heard),used=h.map(()=>false);
  const hit=t.map(w=>{
    let j=h.findIndex((x,i)=>!used[i]&&x===w);
    if(j<0&&w.length>=4)j=h.findIndex((x,i)=>!used[i]&&lev(x,w)<=1);
    if(j>=0){used[j]=true;return true}return false});
  return {score:t.length?hit.filter(Boolean).length/t.length:0,hit};
}
/* la phrase attendue, mot par mot : vert = entendu, rouge = manqué */
function spokenHtml(es,hit){
  let n=0;
  return String(es).split(/([\p{L}]+)/u).map((p,i)=>{
    if(!(i%2))return esc(p);
    const k=sayToks(p).length?hit[n++]:true;
    return `<span class="${k?'sok':'smiss'}">${esc(p)}</span>`}).join('');
}
let REC=null;
function startSpeak(){
  const k=L&&L.cur;if(!k||k.type!=='speak'||k.phase!=='ask'||REC)return;
  const r=new SRec();REC=r;
  r.lang='es-ES';r.interimResults=true;r.maxAlternatives=4;r.continuous=false;
  let finals=[],interim='';k.micErr=null;k.listening=true;renderLesson();
  r.onresult=e=>{
    finals=[];interim='';
    for(let i=0;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)finals.push([...res].map(a=>a.transcript));else interim+=res[0].transcript}
    const st=$('#heard');if(st)st.textContent='« '+(finals.map(f=>f[0]).join(' ')+' '+interim).trim()+' »';
  };
  r.onerror=e=>{k.micErr=e.error};
  r.onend=()=>{
    REC=null;k.listening=false;
    if(!L||L.cur!==k)return;
    if(k.micErr==='not-allowed'||k.micErr==='service-not-allowed'||k.micErr==='audio-capture'){toast('🎤 Micro indisponible ou refusé : exercices oraux en pause pour cette leçon');return noMic()}
    if(k.micErr==='network'){toast('🎤 La reconnaissance vocale du navigateur a besoin d\'Internet');return noMic()}
    const cands=finals.length===1?finals[0]:finals.length?[finals.map(f=>f[0]).join(' ')]:interim.trim()?[interim]:[];
    if(!cands.length){renderLesson();const st=$('#micst');if(st)st.textContent='Je n\'ai rien entendu… touche le micro et parle après le bip.';return}
    let best=null;
    for(const c of cands){const s=oralScore(k.def.es,c);if(!best||s.score>best.score)best={...s,heard:c}}
    judgeSpeak(k,best);
  };
  try{r.start();tone([[880,.09]])}catch(e){REC=null;k.listening=false;noMic()}
}
function judgeSpeak(k,b){
  const say=k.spMode==='say',pct=Math.round(b.score*100);
  const rating=say?(b.score>=.8?2:b.score>=.5?1:0):(b.score>=.8?2:1);
  const ok=b.score>=(say?.6:.7);
  if(ok)S.stats.oral=(S.stats.oral||0)+1;
  k.heard=b.heard;
  const msg=`${spokenHtml(k.def.es,b.hit)}<br><small>Tu as dit : « ${esc(b.heard)} »</small>${say?`<br><small>${esc(k.def.fr)}</small>`:''}`;
  feedback(ok,`${ok?cheer():oops()} · ${pct} %`,msg,rating);
}
/* micro indisponible : la carte devient une carte à retourner, l'oral est mis en pause pour la leçon */
function noMic(){
  if(!L)return;L.noMic=true;stopMic();
  const k=L.cur;if(!k||(k.type!=='speak'&&k.type!=='shadow'))return;
  const dir=k.type==='speak'&&k.spMode==='say'?'fr-es':'es-fr';
  Object.assign(k,{type:'flip',dir,answer:dir==='es-fr'?k.def.fr:k.def.es,phase:'ask',result:null});
  renderLesson();
}
const SH={stream:null,rec:null,url:null,timer:0};
function stopMic(){
  if(REC){try{REC.abort()}catch(e){}REC=null}
  if(SH.rec&&SH.rec.state==='recording')try{SH.rec.stop()}catch(e){}
  if(SH.stream){SH.stream.getTracks().forEach(t=>t.stop());SH.stream=null}
}
async function decodeBuf(ab){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();return await actx.decodeAudioData(ab)}catch(e){return null}}
async function refBuffer(es){try{const r=await fetch(mediaUrl('audio/'+fnv(es.trim())+'.mp3'));return r.ok?await decodeBuf(await r.arrayBuffer()):null}catch(e){return null}}
function trimmed(buf){
  const d=buf.getChannelData(0);let s=0,e=d.length,mx=0;
  for(let i=0;i<d.length;i+=8)mx=Math.max(mx,Math.abs(d[i]));
  const th=Math.max(.01,mx*.08);
  while(s<e&&Math.abs(d[s])<th)s++;while(e>s&&Math.abs(d[e-1])<th)e--;
  return {d,s,e,mx:mx||1,dur:(e-s)/buf.sampleRate};
}
/* les deux formes d'onde sur la même échelle de temps : on compare le rythme et la durée */
function drawWaves(k){
  const pairs=[[$('#wvRef'),k.ref,'#1cb0f6'],[$('#wvMe'),k.me,'#58cc02']].filter(p=>p[0]);
  const tr=pairs.map(p=>p[1]?trimmed(p[1]):null),maxDur=Math.max(.5,...tr.filter(Boolean).map(t=>t.dur));
  pairs.forEach(([cv,buf,col],i)=>{
    const dpr=devicePixelRatio||1,W=cv.width=cv.clientWidth*dpr,H=cv.height=cv.clientHeight*dpr,g=cv.getContext('2d');
    g.clearRect(0,0,W,H);const t=tr[i];if(!t)return;
    const bars=Math.max(4,Math.round(W/(5*dpr)*t.dur/maxDur)),step=(t.e-t.s)/bars,bw=W/Math.round(W/(5*dpr));
    g.fillStyle=col;
    for(let b=0;b<bars;b++){let m=0;for(let j=Math.floor(t.s+b*step);j<t.s+(b+1)*step;j+=4)m=Math.max(m,Math.abs(t.d[j]||0));
      const h=Math.max(2*dpr,m/t.mx*H*.92);g.fillRect(b*bw,(H-h)/2,Math.max(dpr,bw-2*dpr),h)}
  });
}
async function startRec(){
  const k=L&&L.cur;if(!k||k.type!=='shadow'||SH.rec)return;
  try{SH.stream=SH.stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast('🎤 Micro indisponible ou refusé : exercices oraux en pause pour cette leçon');return noMic()}
  try{player.pause()}catch(e){}
  const mr=new MediaRecorder(SH.stream),ch=[];SH.rec=mr;
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  mr.onstop=async()=>{
    SH.rec=null;clearTimeout(SH.timer);
    const blob=new Blob(ch,{type:mr.mimeType||'audio/webm'});
    if(SH.url)URL.revokeObjectURL(SH.url);SH.url=URL.createObjectURL(blob);
    k.me=await decodeBuf(await blob.arrayBuffer());k.recorded=true;k.recording=false;
    if(L&&L.cur===k)renderLesson();
  };
  mr.start();k.recording=true;renderLesson();tone([[880,.09]]);
  const dur=k.ref?trimmed(k.ref).dur:3;
  SH.timer=setTimeout(()=>{if(mr.state==='recording')mr.stop()},(dur*1.8+1.5)*1000);
}

/* ============ GRAMMAIRE ============ */
let GEX=[];
function gramHtml(g){
  const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out='',tbl=null;
  const flush=()=>{if(tbl!==null){out+=`<div class="gtw"><table class="gt">${tbl}</table></div>`;tbl=null}};
  for(const raw of g.body.trim().split('\n')){
    const f=raw.split('|'),c=f.shift().trim(),x=f.join('|').trim();
    if(c!=='t'&&c!=='r')flush();
    if(c==='p')out+=`<p>${md(x)}</p>`;
    else if(c==='h')out+=`<h3>${md(x)}</h3>`;
    else if(c==='l')out+=`<div class="gl">${md(x)}</div>`;
    else if(c==='t')tbl=(tbl||'')+`<tr>${f.map(v=>`<th>${md(v.trim())}</th>`).join('')}</tr>`;
    else if(c==='r')tbl=(tbl||'')+`<tr>${f.map(v=>`<td>${md(v.trim())}</td>`).join('')}</tr>`;
    else if(c==='ex'){const [es,fr]=x.split('=');GEX.push(es.trim());
      out+=`<div class="gex"><button class="spk sm" data-act="gsay:${GEX.length-1}">🔊</button><div><div class="es">${wordsHtml(es.trim())}</div><small class="mute">${esc((fr||'').trim())}</small></div></div>`}
    else if(c==='tip')out+=`<div class="tip">💡 ${md(x)}</div>`;
  }
  flush();return out;
}
const gramFor=u=>GRAMMAR.find(g=>(g.units||[]).includes(u)&&g.step<=curStep()+1);

/* ============ TEST DE NIVEAU ============
   8 paliers de 5 unités (les unités sont classées par difficulté). À chaque palier : jusqu'à 4 questions
   (compréhension + mot manquant). 3 bonnes réponses = palier réussi ; 2 erreurs = fin du test.
   Les phrases des paliers réussis deviennent « connues » et reviennent peu à peu en révision pour vérification. */
const PBANDS=[[1,5,'Premiers pas','A1'],[6,10,'Les bases','A1'],[11,15,'Vie quotidienne','A2'],[16,20,'Raconter','A2'],
  [21,25,'Échanger','A2+'],[26,30,'Opinions','B1'],[31,35,'Nuances','B1'],[36,40,'Aisance','B1+']];
let PT=null;
function placementCard(){
  if(S.placed||S.stats.reviews>20)return '';
  return `<div class="card teaser" data-act="placement" style="margin-top:0;margin-bottom:12px;border-color:var(--purple)"><span>🧭</span><div><b>Tu parles déjà un peu espagnol ?</b><div class="mute">Fais le test de niveau (3 à 8 min) pour ne pas recommencer à zéro.</div></div><b class="go">›</b></div>`;
}
function bandDefs(i){const [a,b]=PBANDS[i];return allDefs().filter(d=>!d.pic&&d.u>=a&&d.u<=b)}
/* questions à réponse libre (pas de propositions : impossible de deviner) :
   mot manquant (avec la traduction), dictée, traduction français → espagnol */
const PKINDS=['cloze','listen','trans','cloze'];
function makePQ(i,k){
  const used=PT?PT.used:new Set(),kind=PKINDS[k%PKINDS.length];
  let defs=shuffle(bandDefs(i).filter(x=>!used.has(x.id)));
  if(kind!=='cloze')defs.sort((a,b)=>toks(a.es).length-toks(b.es).length).splice(Math.ceil(defs.length*.7));  /* phrases pas trop longues à taper */
  for(const d of shuffle(defs)){
    if(kind==='cloze'){const z=makeCloze(d);if(!z)continue;used.add(d.id);return {kind,d,z,ans:z.word}}
    used.add(d.id);return {kind,d,ans:d.es};
  }
  const d=bandDefs(i)[0];return {kind:'trans',d,ans:d.es};
}
function startPlacement(){
  PT={band:0,k:0,ok:0,bad:0,passed:0,used:new Set(),n:0,q:null,res:null,typed:''};
  PT.q=makePQ(0,0);
  $('#sheet').classList.remove('hidden');renderPT();
  if(PT.q.kind==='listen')speak(PT.q.d.es);
}

  else if(q.kind==='listen')prompt=`<div class="q">Écoute et écris en espagnol ce que tu entends</div><div class="prompt"><button class="spk big" data-act="ptsay">🔊</button><button class="spk big" data-act="ptslow" title="Plus lentement">🐢</button></div>`;

  <div class="lbody"><div class="mute">Test de niveau · palier ${PT.band+1}/${PBANDS.length} : ${b[2]}</div>${prompt}
   <input id="ptin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ph}" value="${esc(PT.typed)}" ${r?'disabled':''}>
   <p class="mute" style="margin:8px 0 0;font-size:13px">Les accents oubliés ne comptent pas comme des fautes.</p></div>
  <div class="lfoot ${r?(r.ok?'ok':'bad'):''}"><div>${r?`<div class="fb"><big>${r.ok?'🦜':'🙈'}</big><div><b>${r.ok?cheer():oops()}</b><span>${r.html}</span></div></div><button class="btn block ${r.ok?'':'red'}" data-act="ptnext">Continuer</button>`
   :`<div class="row"><button class="btn ghost" style="flex:none" data-act="ptcheck:skip">Je ne sais pas</button><button class="btn block" data-act="ptcheck">Vérifier</button></div>`}</div></div>`;
  if(!r)setTimeout(()=>{const i=$('#ptin');if(i)i.focus()},30);
}
function ptCheck(skip){
  if(!PT||PT.res)return;
  const q=PT.q,inp=$('#ptin');PT.typed=skip?'':(inp?inp.value:'');
  if(!skip&&!PT.typed.trim()){toast('Écris ta réponse, ou touche « Je ne sais pas »');return}
  let ok=false,html;
  if(q.kind==='cloze'){
    ok=!skip&&['exact','accent','close'].includes(judgeTyped(PT.typed,q.z.word));
    html=`<b>${esc(q.d.es)}</b>`;
  }else{
    const s=oralScore(q.d.es,PT.typed);
    ok=!skip&&s.score>=(q.kind==='listen'?.8:.7);
    html=`<b>${spokenHtml(q.d.es,s.hit)}</b>${q.kind==='listen'?`<br>${esc(q.d.fr)}`:''}`;
  }
  PT.res={ok,html};ok?(PT.ok++,sndOk()):(PT.bad++,sndBad());PT.n++;

function ptNext(){
  PT.res=null;PT.typed='';PT.k++;
  if(PT.ok>=3){PT.passed++;PT.band++;PT.k=PT.ok=PT.bad=0;if(PT.band>=PBANDS.length)return ptEnd()}
  else if(PT.bad>=2)return ptEnd();

  if(PT.q.kind==='listen')speak(PT.q.d.es);

function ptEnd(){
  const n=PT.passed,lv=n?PBANDS[n-1][3]:'Débutant',t=today();let marked=0;
  if(n){
    const maxU=PBANDS[n-1][1];
    /* on ne touche jamais à ce qui a déjà été révisé */
    const ids=shuffle(allDefs().filter(d=>((!d.pic&&d.u<=maxU)||(d.pic&&n>=2))&&!(S.cards[d.id]&&S.cards[d.id].state!=='new')));
    /* étalées sur plusieurs semaines : environ 15 vérifications par jour au maximum */
    const span=Math.min(60,Math.max(14,Math.ceil(ids.length/15)));
    for(const [j,d] of ids.entries()){
      const iv=1+Math.floor(j*span/ids.length),s=Math.max(5,iv*1.5),due=t+iv;
      S.cards[d.id]={id:d.id,state:'review',s,d:5,last:t,interval:iv,due,step:0,reps:1,lapses:0,ease:2.5,placed:1};marked++;
    }
  }
  S.placed={date:dstr(t),bands:n,level:lv};save();
  const st=curStep();

function levelInfo(){
  const st=curStep();
  if(st<=3)return {st,lvl:'A1 (grand débutant)',rule:'phrases très courtes (5 à 8 mots), présent uniquement, mots très courants'};
  if(st<=7)return {st,lvl:'A1-A2 (débutant)',rule:'phrases courtes, surtout le présent, un peu de futur proche (ir a + infinitif)'};
  if(st<=11)return {st,lvl:'A2-B1 (intermédiaire)',rule:'phrases simples, présent, passé (pretérito perfecto, indefinido, imperfecto) et futur'};
  return {st,lvl:'B1 (intermédiaire avancé)',rule:'langage naturel, tous les temps, y compris le subjonctif, quelques expressions idiomatiques'};
}

- Si je dis « no entiendo », « más despacio » ou si je parle français, répète plus lentement avec des mots plus simples, puis traduis en français.
${voc}${t.perso?'- Introduis petit à petit 10 mots spécifiques à ce domaine, en donnant leur traduction française la première fois.\n':''}- Quand je dis « fin », fais un bilan en français : mes 3 erreurs les plus importantes et les mots utiles à retenir. Ce bilan, écris-le aussi pour que je puisse le relire.

/* ============ ÉVÉNEMENTS ============ */
function doAct(a){
  const [act,arg]=a.split(':');
  const k=L&&L.cur;
  switch(act){
    case 'tab':tab=arg;render();scrollTo(0,0);break;
    case 'start':startLesson();break;
    case 'bonus':startLesson(5);break;
    case 'practice':startPractice();break;
    case 'chest':openChest();break;
    case 'close':closeLesson();break;
    case 'speak':if(k)speak(k.def.es);break;
    case 'speakslow':if(k)speak(k.def.es,.55);break;
    case 'testVoice':speak('Hola, me llamo Ana.');break;
    case 'show':if(k&&k.phase==='ask'){k.phase='rate';renderLesson();if(S.set.speak&&(k.dir==='fr-es'||k.def.pic))speak(k.def.es)}break;
    case 'rate':if(k&&k.type==='flip'&&k.phase==='rate')commit(+arg);break;
    case 'pick':if(k&&k.choices&&k.phase==='ask'){
      k.picked=+arg;const ok=k.choices[+arg]===k.answer;
      if(k.def.pic){ok?feedback(true,cheer(),picMsg(k.def),2):feedback(false,oops(),'Réponse : '+picMsg(k.def),0);break}
      if(ok)feedback(true,cheer(),'',k.type==='qcm'&&Date.now()-k.t0<3500&&k.card.state==='review'?3:2);
      else feedback(false,oops(),'Réponse : <b>'+esc(k.answer)+'</b>',0);
    }break;
    case 'tile':if(k&&k.type==='order'&&k.phase==='ask'){const t=k.bank[+arg];if(t&&!t.used){t.used=true;k.built.push(+arg);renderLesson()}}break;
    case 'untile':if(k&&k.type==='order'&&k.phase==='ask'){const i=k.built.splice(+arg,1)[0];if(i!=null)k.bank[i].used=false;renderLesson()}break;
    case 'check':if(k&&k.phase==='ask'){
      if(k.type==='order'){
        if(!k.built.length)break;
        const got=k.built.map(i=>k.bank[i].w).join(' ').toLowerCase();
        if(got===k.target.join(' ').toLowerCase())feedback(true,cheer(),'',2);
        else feedback(false,oops(),'Réponse : <b>'+esc(k.def.es)+'</b>',0);
      }else if(k.type==='pict'){
        k.typed=$('#typein').value;const j=judgePic(k.typed,k.answer),m=picMsg(k.def);
        if(j==='exact')feedback(true,cheer(),m,2);
        else if(j==='accent')feedback(true,'¡Casi perfecto!','Attention aux accents : '+m,2);
        else if(j==='article')feedback(true,'Presque !','N\'oublie pas le bon article : '+m,1);
        else if(j==='close')feedback(true,'Presque !','Il y a une petite faute : '+m,1);
        else feedback(false,oops(),'Réponse : '+m,0);
      }else if(needsInput(k))judgeAndFeedback(k);
    }break;
    case 'idk':if(k&&k.phase==='ask'&&k.type!=='flip'){
      const inp=$('#typein');k.typed=inp?inp.value:'';
      if(k.def.pic){feedback(false,'Pas de souci !','Réponse : '+picMsg(k.def),0);break}
      feedback(false,'Pas de souci !','Réponse : <b>'+esc(k.answer)+'</b>'+(k.type==='listen'?`<br><span style="opacity:.8">${esc(k.def.fr)}</span>`:''),0);}break;
    case 'next':if(k&&k.phase==='fb')commit(k.result.rating);break;
    case 'addCard':{
      const es=$('#addEs').value.trim(),fr=$('#addFr').value.trim();
      if(!es||!fr){toast('Remplis les deux champs');return}
      S.custom.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),es,fr});save();toast('Carte ajoutée ✅');render();break}
    case 'delCard':S.custom=S.custom.filter(c=>c.id!==arg);delete S.cards[arg];delete S.mistakes[arg];save();render();break;
    case 'importCards':{
      const txt=$('#impTxt').value,col=$('#impCol').value;let n=0;
      for(const line of txt.split(/\r?\n/)){
        if(!line.trim()||line.startsWith('#'))continue;
        const sep=line.includes('\t')?'\t':line.includes(';')?';':',';
        const p=line.split(sep).map(s=>s.replace(/<[^>]*>/g,'').replace(/^"|"$/g,'').trim());
        if(p.length<2||!p[0]||!p[1])continue;
        const [es,fr]=col==='es'?[p[0],p[1]]:[p[1],p[0]];
        S.custom.push({id:'c'+Date.now()+'_'+(n++)+Math.random().toString(36).slice(2,4),es,fr});
      }
      save();toast(n?`📥 ${n} carte(s) importée(s)`:'Aucune carte reconnue');render();break}
    case 'exportJson':{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
      a.download='espanki-sauvegarde-'+dstr(today())+'.json';a.click();break}
    case 'linkNew':linkNew();break;
    case 'linkOld':linkOld();break;
    case 'reconnect':reconnect();break;
    case 'importJson':$('#jsonFile').click();break;
    case 'mic':if(k&&k.type==='speak'&&k.phase==='ask'){if(REC){try{REC.stop()}catch(e){}}else startSpeak()}break;
    case 'rec':if(k&&k.type==='shadow'&&k.phase==='ask'){if(SH.rec)SH.rec.stop();else startRec()}break;
    case 'playme':playMine();break;
    case 'shadowok':if(k&&k.type==='shadow'&&k.recorded&&!k.recording){S.stats.oral=(S.stats.oral||0)+1;k.result={ok:true};commit(2)}break;
    case 'nomic':noMic();break;
    case 'sayword':speak(arg);break;
    case 'story':startStory(arg);break;
    case 'sans':{const p=a.split(':');storyAnswer(p[1],p[2]);break}
    case 'sline':if(ST&&ST.shown[+arg])speak(ST.shown[+arg].es);break;
    case 'strad':if(ST&&ST.shown[+arg]){const sb=$('#sbody'),y=sb?sb.scrollTop:0;ST.shown[+arg].tr=!ST.shown[+arg].tr;renderStory();$('#sbody').scrollTop=y}break;
    case 'snext':advanceStory();break;
    case 'closeSheet':closeSheet();break;
    case 'gram':openGram(arg);break;
    case 'gsay':if(GEX[+arg])speak(GEX[+arg]);break;
    case 'offline':precacheAll();break;
    case 'talk':startTalk(arg);break;
    case 'talkRandom':randomTalk();break;
    case 'placement':startPlacement();break;
    case 'ptcheck':ptCheck(arg==='skip');break;
    case 'ptslow':if(PT)speak(PT.q.d.es,.55);break;
    case 'ptnext':ptNext();break;
    case 'ptsay':if(PT)speak(PT.q.d.es);break;
    case 'ptquit':if(confirm('Arrêter le test ? Rien ne sera modifié.')){PT=null;closeSheet()}break;
    case 'talkGo':{const p=a.split(':'),t=TALKS.find(x=>x.id===p[1]);if(!t)break;
      if(p[2]==='voice')voiceGuide(t);else{closeSheetOnly();openAI(talkPrompt(t,'write'))}break}
    case 'talkOpen':{const p=a.split(':'),t=TALKS.find(x=>x.id===p[1]);if(!t)break;closeSheetOnly();openAI(talkPrompt(t,p[2]));break}
    case 'explain':if(k)openAI(explainPrompt());break;
    case 'setai':S.set.ai=arg;save();$('#sheet').classList.add('hidden');$('#sheet').innerHTML='';if(AIPEND){const p=AIPEND;AIPEND=null;openAI(p)}if(!L)render();break;
    case 'persoOk':{const t=TALKS.find(x=>x.id===arg),v=($('#persoIn')||{}).value||'';if(!t||!v.trim()){toast('Écris quelque chose 🙂');break}
      S.set[t.perso]=v.trim();save();render();talkModeSheet(t);break}
    case 'editperso':{const t=TALKS.find(x=>x.id===arg);if(t)persoForm(t);break}
    case 'install':if(INST){INST.prompt();INST=null;render()}break;
    case 'hideInstall':S.set.hideInstall=true;save();render();break;
    case 'reset':if(confirm('Effacer toute ta progression ? Cette action est définitive.')){S=defaults();save();render()}break;
  }
}
document.addEventListener('click',e=>{
  const w=e.target.closest('.w');
  if(w&&!e.target.closest('[data-act]')){showGloss(w);return}
  if(!e.target.closest('#gloss'))hideGloss();
  const b=e.target.closest('[data-act]');if(b){if(S.set.sound&&!actx)try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}doAct(b.dataset.act)}
});
document.addEventListener('change',e=>{
  const s=e.target.dataset&&e.target.dataset.set;
  if(s){let v=e.target.value;if(v==='true')v=true;else if(v==='false')v=false;else if(/^\d+$/.test(v))v=+v;S.set[s]=v;save();render()}
  if(e.target.id==='jsonFile'&&e.target.files[0]){
    e.target.files[0].text().then(t=>{try{S=norm(JSON.parse(t));save();toast('Sauvegarde restaurée ✅');render()}catch(_){toast('Fichier invalide')}});
  }
});
addEventListener('scroll',hideGloss,true);
document.addEventListener('keydown',e=>{
  if(!$('#sheet').classList.contains('hidden')){
    if(e.key==='Escape')closeSheet();
    else if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='persoIn'){const b=$('[data-act^="persoOk"]');if(b)doAct(b.dataset.act)}
    else if(e.key==='Enter'&&ST&&!ST.wait){e.preventDefault();ST.over?closeSheet():advanceStory()}
    else if(PT){if(e.key==='Enter'){e.preventDefault();PT.res?ptNext():ptCheck(false)}}
    else if(ST&&ST.wait&&/^[1-3]$/.test(e.key))storyAnswer(ST.shown.length-1,+e.key-1);
    return;
  }
  if(!L||!L.cur||$('#lesson').classList.contains('hidden'))return;
  const k=L.cur,typing=document.activeElement&&document.activeElement.id==='typein';
  if(e.key==='Escape')return;
  if(L.over){if(e.key==='Enter')closeLesson();return}
  if(e.key==='Enter'||(e.key===' '&&!typing)){
    e.preventDefault();
    if(k.phase==='fb')doAct('next');
    else if(k.type==='flip')doAct(k.phase==='ask'?'show':'rate:2');
    else if(needsInput(k)||k.type==='order')doAct('check');
    else if(k.type==='speak')doAct('mic');
    else if(k.type==='shadow')doAct(k.recorded&&!k.recording?'shadowok':'rec');
    return;
  }
  if(typing)return;
  if(k.type==='order'&&k.phase==='ask'&&e.key==='Backspace'&&k.built.length){e.preventDefault();doAct('untile:'+(k.built.length-1));return}
  if(/^[1-4]$/.test(e.key)){
    if(k.choices&&k.phase==='ask'&&+e.key<=k.choices.length)doAct('pick:'+(+e.key-1));
    else if(k.type==='flip'&&k.phase==='rate')doAct('rate:'+(+e.key-1));
  }
});
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(tab==='set'&&!L)render()}}
addEventListener('pagehide',()=>{if(srvMode&&syncReady){try{navigator.sendBeacon('/api/progress',new Blob([JSON.stringify(S)],{type:'application/json'}))}catch(e){}}});
render();initSync();
</script>
</body>
</html>
